<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0a1383"
>

<title>
  ลืมรหัสผ่าน | Student Card System
</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #ffffff 80%,
      #eef0ff 100%
    );

  color:
    #111827;

}


.page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}


.card {

  width: 100%;

  max-width: 440px;

  background: #ffffff;

  padding: 32px 28px;

  border:
    1px solid #e1e4ef;

  border-top:
    6px solid #0a1383;

  border-radius: 18px;

  box-shadow:
    0 15px 40px
    rgba(10,19,131,.12);

}


.icon {

  width: 80px;

  height: 80px;

  margin:
    0 auto 18px;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    #eef0ff;

  color:
    #0a1383;

  font-size:
    38px;

}


h1 {

  margin: 0;

  text-align: center;

  color:
    #0a1383;

  font-size: 24px;

}


.subtitle {

  margin:
    8px 0 26px;

  text-align:
    center;

  color:
    #6b7280;

  font-size:
    13px;

}


.group {

  margin-bottom:
    18px;

}


label {

  display: block;

  margin-bottom:
    7px;

  font-size:
    14px;

  font-weight:
    600;

}


input,
textarea {

  width: 100%;

  border:
    1px solid #d9ddea;

  border-radius:
    9px;

  outline: none;

  font-size:
    15px;

  padding:
    12px 14px;

}


input {

  height: 50px;

}


textarea {

  min-height: 110px;

  resize: vertical;

}


input:focus,
textarea:focus {

  border-color:
    #0a1383;

  box-shadow:
    0 0 0 3px
    rgba(10,19,131,.08);

}


button {

  width: 100%;

  height: 50px;

  border: none;

  border-radius: 10px;

  background:
    #0a1383;

  color:
    #ffffff;

  font-size:
    15px;

  font-weight:
    bold;

  cursor:
    pointer;

}


button:disabled {

  opacity: .6;

  cursor:
    not-allowed;

}


.message {

  min-height: 22px;

  margin-top: 15px;

  text-align: center;

  font-size: 13px;

  font-weight: 600;

}


.message.error {

  color:
    #dc2626;

}


.message.success {

  color:
    #15803d;

}


.message.info {

  color:
    #0a1383;

}


.back {

  display: block;

  margin-top: 22px;

  text-align: center;

  color:
    #0a1383;

  text-decoration: none;

  font-size: 13px;

}


.back:hover {

  text-decoration:
    underline;

}


.footer {

  margin-top: 24px;

  text-align: center;

  color:
    #9ca3af;

  font-size: 10px;

}

</style>

</head>


<body>


<div class="page">


<div class="card">


<div class="icon">
  🔑
</div>


<h1>
  ลืมรหัสผ่าน
</h1>


<div class="subtitle">
  ส่งคำร้องขอรีเซ็ตรหัสผ่านถึงผู้ดูแลระบบ
</div>


<form id="forgotForm">


<div class="group">

<label for="studentId">
  รหัสนักศึกษา
</label>

<input
  id="studentId"
  type="text"
  placeholder="กรอกรหัสนักศึกษา"
  autocomplete="username"
  required
>

</div>


<div class="group">

<label for="requestNote">
  รายละเอียด
</label>

<textarea
  id="requestNote"
  placeholder="เช่น ลืมรหัสผ่าน ไม่สามารถเข้าสู่ระบบได้"
  required
></textarea>

</div>


<button
  id="submitButton"
  type="submit"
>

ส่งคำร้อง

</button>


<div
  id="message"
  class="message"
></div>


</form>


<a
  href="index.html"
  class="back"
>

← กลับหน้าเข้าสู่ระบบ

</a>


<div class="footer">
  Student Card System
</div>


</div>

</div>



<script>

const CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbxCvk2wb6FydCKNkEDvApbTgZWmSFoAzPvvM2sSDOIwSgvftMoQxIX3cy7npP3_6xT4/exec"

};


document.addEventListener(
  "DOMContentLoaded",
  function () {

    document
      .getElementById("forgotForm")
      .addEventListener(
        "submit",
        submitForgotPassword
      );

  }
);



async function submitForgotPassword(
  event
) {

  event.preventDefault();


  const studentId =
    document
      .getElementById("studentId")
      .value
      .trim();


  const requestNote =
    document
      .getElementById("requestNote")
      .value
      .trim();


  const button =
    document
      .getElementById("submitButton");


  if (!studentId || !requestNote) {

    showMessage(
      "กรุณากรอกข้อมูลให้ครบ",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "กำลังส่งคำร้อง...";


  showMessage(
    "กำลังส่งคำร้องไปยัง Admin...",
    "info"
  );


  try {

    const response =
      await fetch(
        CONFIG.API_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "forgotPassword",

              student_id:
                studentId,

              request_note:
                requestNote

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      showMessage(
        result.message ||
        "ส่งคำร้องไม่สำเร็จ",
        "error"
      );

      return;

    }


    showMessage(

      "ส่งคำร้องสำเร็จแล้ว กรุณารอ Admin ตรวจสอบ",

      "success"

    );


    document
      .getElementById("forgotForm")
      .reset();


  } catch (error) {

    console.error(error);

    showMessage(

      "ไม่สามารถเชื่อมต่อระบบได้",

      "error"

    );

  } finally {

    button.disabled = false;

    button.textContent =
      "ส่งคำร้อง";

  }

}



function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " +
    (type || "");

}

</script>


</body>

</html>
