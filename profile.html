<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>
        ประวัตินักศึกษา
    </title>


    <link
        rel="stylesheet"
        href="css/profile.css"
    >

</head>


<body>


<div class="profile-page">


    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="profile-header">


        <button
            class="back-button"
            onclick="goBack()"
            type="button"
            aria-label="ย้อนกลับ"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

            <span>
                กลับ
            </span>

        </button>


        <div class="profile-header-title">

            <div class="header-title-main">
                ประวัตินักศึกษา
            </div>

            <div class="header-title-sub">
                STUDENT PROFILE
            </div>

        </div>


        <div class="header-space"></div>


    </header>



    <!-- =========================================
         MAIN
         ========================================= -->

    <main class="profile-main">


        <!-- =====================================
             PROFILE TOP
             ===================================== -->

        <section class="profile-top">


            <div class="photo-container">

                <img
                    id="profilePhoto"
                    src=""
                    alt="รูปนักศึกษา"
                >

            </div>


            <div class="profile-name-area">


                <div
                    id="profileFullName"
                    class="profile-full-name"
                >
                    -
                </div>


                <div
                    id="profileFullNameEn"
                    class="profile-full-name-en"
                >
                    -
                </div>


                <div
                    id="profileStudentId"
                    class="profile-student-id"
                >
                    รหัส -
                </div>


                <div
                    id="profileStatus"
                    class="profile-status"
                >
                    -
                </div>


            </div>


        </section>



        <!-- =====================================
             INFORMATION
             ===================================== -->

        <section class="information-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    ข้อมูลนักศึกษา
                </span>

            </div>



            <!-- STUDENT ID -->

            <div class="info-row">

                <div class="info-label">
                    รหัสนักศึกษา
                </div>

                <div
                    id="studentId"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <!-- THAI NAME -->

            <div class="info-row">

                <div class="info-label">
                    ชื่อ-สกุล
                </div>

                <div
                    id="studentName"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <!-- ENGLISH NAME -->

            <div class="info-row">

                <div class="info-label">
                    ชื่อภาษาอังกฤษ
                </div>

                <div
                    id="studentNameEn"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <!-- DEPARTMENT -->

            <div class="info-row">

                <div class="info-label">
                    สาขาวิชา
                </div>

                <div
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <!-- STATUS -->

            <div class="info-row">

                <div class="info-label">
                    สถานะ
                </div>

                <div
                    id="studentStatus"
                    class="info-value status-value"
                >
                    -
                </div>

            </div>



            <!-- PHONE -->

            <div class="info-row">

                <div class="info-label">
                    เบอร์โทรศัพท์
                </div>

                <div
                    id="studentPhone"
                    class="info-value"
                >
                    -
                </div>

            </div>


        </section>



        <!-- =====================================
             CARD INFORMATION
             ===================================== -->

        <section class="information-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    ข้อมูลบัตรนักศึกษา
                </span>

            </div>



            <!-- ISSUE DATE -->

            <div class="info-row">

                <div class="info-label">
                    วันที่ออกบัตร
                </div>

                <div
                    id="issueDate"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <!-- EXPIRE DATE -->

            <div class="info-row">

                <div class="info-label">
                    วันหมดอายุ
                </div>

                <div
                    id="expireDate"
                    class="info-value"
                >
                    -
                </div>

            </div>


        </section>



        <!-- =====================================
             STUDENT CARD BUTTON
             ===================================== -->

        <button
            class="student-card-button"
            type="button"
            onclick="openStudentCard()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="2"
                ></rect>

                <circle
                    cx="8"
                    cy="11"
                    r="2"
                ></circle>

                <path
                    d="M13 10h5"
                ></path>

                <path
                    d="M13 14h5"
                ></path>

            </svg>


            <span>
                ดูบัตรนักศึกษา
            </span>

        </button>


    </main>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer class="profile-footer">

        Student Card System

    </footer>


</div>



<script src="js/config.js"></script>

<script src="js/profile.js"></script>


</body>

</html>
