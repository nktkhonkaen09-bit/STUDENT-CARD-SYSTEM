<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>
        ประวัตินักศึกษา
    </title>


    <link
        rel="stylesheet"
        href="css/profile.css"
    >


    <style>

        /* =========================================
           CHANGE PROFILE PHOTO
        ========================================= */

        .photo-container {
            position: relative;
        }


        .photo-edit-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 10px;

            padding: 8px 14px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #101d91,
                    #1d4ed8
                );

            color: #ffffff;

            font-family:
                inherit;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 12px
                rgba(16, 29, 145, .18);

            transition:
                transform .15s ease,
                box-shadow .15s ease,
                opacity .15s ease;

        }


        .photo-edit-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 6px 16px
                rgba(16, 29, 145, .24);

        }


        .photo-edit-button:active {

            transform:
                scale(.98);

        }


        .photo-edit-button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;

        }


        .photo-upload-status {

            min-height: 20px;

            margin-top: 6px;

            font-size: 12px;

            line-height: 1.4;

        }


        .photo-upload-status.success {

            color: #15803d;

        }


        .photo-upload-status.error {

            color: #dc2626;

        }


        .photo-upload-status.loading {

            color: #1d4ed8;

        }


        .photo-preview-overlay {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(0, 0, 0, .72);

        }


        .photo-preview-overlay.show {

            display: flex;

        }


        .photo-preview-box {

            width: min(
                100%,
                420px
            );

            background: #ffffff;

            border-radius: 18px;

            padding: 18px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, .25);

            text-align: center;

        }


        .photo-preview-title {

            margin-bottom: 14px;

            color: #101d91;

            font-size: 18px;

            font-weight: 800;

        }


        #photoPreview {

            display: block;

            width: 190px;

            height: 230px;

            margin:
                0 auto 16px;

            object-fit: cover;

            border-radius: 12px;

            border:
                2px solid #dbe2f0;

            background: #f3f4f6;

        }


        .photo-preview-actions {

            display: flex;

            gap: 10px;

        }


        .photo-preview-actions button {

            flex: 1;

            min-height: 44px;

            border: none;

            border-radius: 10px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

        }


        #cancelPhotoUploadBtn {

            background: #eef1f7;

            color: #374151;

        }


        #confirmPhotoUploadBtn {

            background:
                linear-gradient(
                    135deg,
                    #101d91,
                    #1d4ed8
                );

            color: #ffffff;

        }


        #confirmPhotoUploadBtn:disabled {

            opacity: .6;

            cursor: not-allowed;

        }


        @media (max-width: 480px) {

            .photo-edit-button {

                width: 100%;

                max-width: 190px;

            }


            .photo-preview-box {

                padding: 15px;

            }


            #photoPreview {

                width: 170px;

                height: 210px;

            }

        }

    </style>

</head>


<body>


<div class="profile-page">


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="profile-header">


        <button
            class="back-button"
            onclick="goBack()"
            type="button"
            aria-label="ย้อนกลับ"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

            <span>
                กลับ
            </span>

        </button>


        <div class="profile-header-title">

            <div class="header-title-main">
                ประวัตินักศึกษา
            </div>

            <div class="header-title-sub">
                STUDENT PROFILE
            </div>

        </div>


        <div class="header-space"></div>


    </header>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="profile-main">


        <!-- =====================================
             PROFILE TOP
        ===================================== -->

        <section class="profile-top">


            <div class="photo-container">

                <img
                    id="profilePhoto"
                    src=""
                    alt="รูปนักศึกษา"
                >


                <button
                    type="button"
                    id="changePhotoBtn"
                    class="photo-edit-button"
                >
                    📷 เปลี่ยนรูป
                </button>


                <input
                    type="file"
                    id="photoFileInput"
                    accept="image/jpeg,image/png,image/webp"
                    hidden
                >


                <div
                    id="photoUploadStatus"
                    class="photo-upload-status"
                    aria-live="polite"
                ></div>

            </div>


            <div class="profile-name-area">


                <div
                    id="profileFullName"
                    class="profile-full-name"
                >
                    -
                </div>


                <div
                    id="profileFullNameEn"
                    class="profile-full-name-en"
                >
                    -
                </div>


                <div
                    id="profileStudentId"
                    class="profile-student-id"
                >
                    รหัส -
                </div>


                <div
                    id="profileStatus"
                    class="profile-status"
                >
                    -
                </div>


            </div>


        </section>



        <!-- =====================================
             INFORMATION
        ===================================== -->

        <section class="information-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    ข้อมูลนักศึกษา
                </span>

            </div>



            <div class="info-row">

                <div class="info-label">
                    รหัสนักศึกษา
                </div>

                <div
                    id="studentId"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <div class="info-row">

                <div class="info-label">
                    ชื่อ-สกุล
                </div>

                <div
                    id="studentName"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <div class="info-row">

                <div class="info-label">
                    ชื่อภาษาอังกฤษ
                </div>

                <div
                    id="studentNameEn"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <div class="info-row">

                <div class="info-label">
                    สาขาวิชา
                </div>

                <div
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <div class="info-row">

                <div class="info-label">
                    สถานะ
                </div>

                <div
                    id="studentStatus"
                    class="info-value status-value"
                >
                    -
                </div>

            </div>



            <div class="info-row">

                <div class="info-label">
                    เบอร์โทรศัพท์
                </div>

                <div
                    id="studentPhone"
                    class="info-value"
                >
                    -
                </div>

            </div>


        </section>



        <!-- =====================================
             CARD INFORMATION
        ===================================== -->

        <section class="information-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    ข้อมูลบัตรนักศึกษา
                </span>

            </div>



            <div class="info-row">

                <div class="info-label">
                    วันที่ออกบัตร
                </div>

                <div
                    id="issueDate"
                    class="info-value"
                >
                    -
                </div>

            </div>



            <div class="info-row">

                <div class="info-label">
                    วันหมดอายุ
                </div>

                <div
                    id="expireDate"
                    class="info-value"
                >
                    -
                </div>

            </div>


        </section>



        <!-- =====================================
             STUDENT CARD BUTTON
        ===================================== -->

        <button
            class="student-card-button"
            type="button"
            onclick="openStudentCard()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <rect
                    x="3"
                    y="5"
                    width="18"
                    height="14"
                    rx="2"
                ></rect>

                <circle
                    cx="8"
                    cy="11"
                    r="2"
                ></circle>

                <path
                    d="M13 10h5"
                ></path>

                <path
                    d="M13 14h5"
                ></path>

            </svg>


            <span>
                ดูบัตรนักศึกษา
            </span>

        </button>


    </main>



    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer class="profile-footer">

        Student Card System

    </footer>


</div>



<!-- =========================================
     PHOTO PREVIEW MODAL
========================================= -->

<div
    id="photoPreviewOverlay"
    class="photo-preview-overlay"
    aria-hidden="true"
>


    <div
        class="photo-preview-box"
    >

        <div class="photo-preview-title">

            ตัวอย่างรูปโปรไฟล์

        </div>


        <img
            id="photoPreview"
            src=""
            alt="ตัวอย่างรูปใหม่"
        >


        <div class="photo-preview-actions">


            <button
                type="button"
                id="cancelPhotoUploadBtn"
            >
                ยกเลิก
            </button>


            <button
                type="button"
                id="confirmPhotoUploadBtn"
            >
                💾 บันทึกรูป
            </button>


        </div>


    </div>

</div>



<script src="js/config.js"></script>

<script src="js/profile.js"></script>


</body>

</html>
