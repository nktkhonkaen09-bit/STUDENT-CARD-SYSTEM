<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#f5a900">

    <title>
        ระบบบริการนักศึกษา
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

<div class="login-page">

    <div class="login-container">

        <div class="logo-container">

            <img
                src="assets/logo.png"
                alt="Logo"
                class="school-logo"
                onerror="this.style.display='none'">

        </div>


        <h1>
            ระบบบริการนักศึกษา
        </h1>

        <p class="system-name">
            STUDENT SERVICE SYSTEM
        </p>


        <form
            id="loginForm"
            autocomplete="on">


            <div class="input-group">

                <label for="studentId">
                    รหัสนักศึกษา
                </label>

                <input
                    id="studentId"
                    name="username"
                    type="text"
                    placeholder="กรอกรหัสนักศึกษา"
                    autocomplete="username"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    รหัสผ่าน
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="กรอกรหัสผ่าน"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                id="loginButton"
                type="submit">

                เข้าสู่ระบบ

            </button>


            <!-- ==================================================
                 CHANGE PASSWORD
            =================================================== -->

            <a
                href="change-password.html"
                class="change-password-link"
            >
                🔐 เปลี่ยนรหัสผ่าน
            </a>


            <div
                id="loginMessage"
                class="login-message">
            </div>


        </form>


        <div class="login-footer">

            Student Card System

        </div>

    </div>

</div>


<script src="js/config.js"></script>
<script src="js/login.js"></script>

</body>

</html>
