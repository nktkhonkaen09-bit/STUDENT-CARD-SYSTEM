<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>
        ระบบบริการนักศึกษา
    </title>


    <!-- =========================================
         DASHBOARD CSS
         ========================================= -->

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

</head>


<body>


<div class="dashboard-page">


    <!-- =========================================
         HEADER
         ========================================= -->

    <header class="dashboard-header">


        <!-- LEFT -->

        <div class="header-left">


            <img
                src="assets/logo.png"
                alt="Logo"
                class="header-logo"
                onerror="this.style.display='none'"
            >


            <div>

                <div class="header-system-name">
                    ระบบบริการนักศึกษา
                </div>

                <div class="header-system-subtitle">
                    STUDENT SERVICE SYSTEM
                </div>

            </div>


        </div>


        <!-- STUDENT INFO -->

        <div class="header-student">


            <div
                id="headerStudentId"
                class="header-student-id"
            >
                -
            </div>


            <div
                id="headerStudentName"
                class="header-student-name"
            >
                -
            </div>


        </div>


    </header>



    <!-- =========================================
         MAIN
         ========================================= -->

    <main class="dashboard-main">


        <!-- WELCOME -->

        <section class="welcome-section">


            <h1 class="welcome-title">
                เมนูบริการนักศึกษา
            </h1>


            <p class="welcome-subtitle">
                กรุณาเลือกเมนูที่ต้องการ
            </p>


        </section>



        <!-- =====================================
             MENU
             ===================================== -->

        <section class="dashboard-menu">


            <!-- =================================
                 1. PROFILE
                 ================================= -->

            <div
                class="menu-card"
                onclick="openProfile()"
            >


                <div class="menu-icon">
                    👤
                </div>


                <div class="menu-title">
                    ประวัตินักศึกษา
                </div>


                <div class="menu-description">
                    ดูข้อมูลประวัติและข้อมูลส่วนตัว
                </div>


            </div>



            <!-- =================================
                 2. STUDENT CARD
                 ================================= -->

            <div
                class="menu-card"
                onclick="openStudentCard()"
            >


                <div class="menu-icon">
                    🪪
                </div>


                <div class="menu-title">
                    บัตรนักศึกษา
                </div>


                <div class="menu-description">
                    ดูบัตรนักศึกษาและ QR Code
                </div>


            </div>



            <!-- =================================
                 3. CHANGE PASSWORD
                 ================================= -->

            <div
                class="menu-card"
                onclick="openChangePassword()"
            >


                <div class="menu-icon">
                    🔐
                </div>


                <div class="menu-title">
                    เปลี่ยนรหัสผ่าน
                </div>


                <div class="menu-description">
                    เปลี่ยนรหัสผ่านเข้าสู่ระบบ
                </div>


            </div>



            <!-- =================================
                 4. LOGOUT
                 ================================= -->

            <div
                class="menu-card"
                onclick="logout()"
            >


                <div class="menu-icon">
                    🚪
                </div>


                <div class="menu-title">
                    ออกจากระบบ
                </div>


                <div class="menu-description">
                    ออกจากระบบบริการนักศึกษา
                </div>


            </div>


        </section>


    </main>



    <!-- =========================================
         FOOTER
         ========================================= -->

    <footer class="dashboard-footer">

        Student Card System

    </footer>


</div>



<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script src="js/config.js"></script>

<script src="js/dashboard.js"></script>


</body>

</html>
