<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#F5A900">

    <title>
        Student Service System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/dashboard.css">

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="app-header">

        <div class="student-header">

            <div class="student-avatar">

                <span id="avatarText">
                    👤
                </span>

            </div>


            <div class="student-header-info">

                <div
                    id="headerStudentId"
                    class="student-id">

                    -

                </div>


                <div
                    id="headerStudentName"
                    class="student-name">

                    -

                </div>

            </div>

        </div>


        <button
            id="logoutButton"
            class="header-logout"
            type="button"
            aria-label="ออกจากระบบ">

            <span>↪</span>

        </button>

    </header>



    <!-- MENU TITLE -->

    <div class="menu-title">

        เมนู

    </div>



    <!-- MENU -->

    <main class="menu-grid">


        <!-- PROFILE -->

        <button
            class="menu-card"
            type="button"
            onclick="openProfile()">

            <div class="menu-icon profile">

                <span>👤</span>

            </div>


            <div class="menu-label">

                ประวัตินักศึกษา

            </div>

        </button>



        <!-- STUDENT CARD -->

        <button
            class="menu-card"
            type="button"
            onclick="openStudentCard()">

            <div class="menu-icon card">

                <span>💳</span>

            </div>


            <div class="menu-label">

                บัตรนักศึกษา

            </div>

        </button>



        <!-- PASSWORD -->

        <button
            class="menu-card"
            type="button"
            onclick="openChangePassword()">

            <div class="menu-icon password">

                <span>🔑</span>

            </div>


            <div class="menu-label">

                เปลี่ยนรหัสผ่าน

            </div>

        </button>



        <!-- LOGOUT -->

        <button
            class="menu-card"
            type="button"
            onclick="logout()">

            <div class="menu-icon logout">

                <span>↪</span>

            </div>


            <div class="menu-label">

                ออกจากระบบ

            </div>

        </button>


    </main>



    <!-- FOOTER -->

    <footer class="app-footer">

        STUDENT SERVICE SYSTEM

    </footer>


</div>


<script src="js/config.js"></script>
<script src="js/dashboard.js"></script>

</body>

</html>
