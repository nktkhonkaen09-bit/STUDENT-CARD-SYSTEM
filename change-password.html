<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>
        เปลี่ยนรหัสผ่าน
    </title>


    <link
        rel="stylesheet"
        href="css/change-password.css"
    >

</head>


<body>


<div class="password-page">


    <!-- HEADER -->

    <header class="password-header">

        <button
            class="back-button"
            type="button"
            onclick="goBack()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

            <span>
                กลับ
            </span>

        </button>


        <div class="header-title">

            <div class="header-title-main">
                เปลี่ยนรหัสผ่าน
            </div>

            <div class="header-title-sub">
                CHANGE PASSWORD
            </div>

        </div>


        <div></div>

    </header>



    <!-- MAIN -->

    <main class="password-main">


        <section class="password-card">


            <div class="password-icon">

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                    ></rect>

                    <path
                        d="M8 10V7a4 4 0 0 1 8 0v3"
                    ></path>

                    <circle
                        cx="12"
                        cy="15"
                        r="1"
                    ></circle>

                </svg>

            </div>


            <h1>
                เปลี่ยนรหัสผ่าน
            </h1>


            <p class="password-description">

                กรุณากรอกรหัสผ่านเดิม
                และกำหนดรหัสผ่านใหม่

            </p>



            <form
                id="changePasswordForm"
                autocomplete="off"
            >


                <!-- OLD PASSWORD -->

                <div class="input-group">

                    <label for="oldPassword">
                        รหัสผ่านเดิม
                    </label>


                    <div class="password-input">

                        <input
                            id="oldPassword"
                            type="password"
                            placeholder="กรอกรหัสผ่านเดิม"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('oldPassword', this)"
                            aria-label="แสดงรหัสผ่าน"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- NEW PASSWORD -->

                <div class="input-group">

                    <label for="newPassword">
                        รหัสผ่านใหม่
                    </label>


                    <div class="password-input">

                        <input
                            id="newPassword"
                            type="password"
                            placeholder="อย่างน้อย 6 ตัวอักษร"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('newPassword', this)"
                            aria-label="แสดงรหัสผ่าน"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        ยืนยันรหัสผ่านใหม่
                    </label>


                    <div class="password-input">

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                            aria-label="แสดงรหัสผ่าน"
                        >
                            👁
                        </button>

                    </div>

                </div>



                <!-- MESSAGE -->

                <div
                    id="passwordMessage"
                    class="password-message"
                ></div>



                <!-- BUTTON -->

                <button
                    id="changePasswordButton"
                    class="change-button"
                    type="submit"
                >

                    เปลี่ยนรหัสผ่าน

                </button>


            </form>


        </section>


    </main>



    <footer class="password-footer">

        Student Card System

    </footer>


</div>



<script src="js/config.js"></script>

<script src="js/change-password.js"></script>


</body>

</html>
