<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>ลงทะเบียนเรียน</title>

    <link
        rel="stylesheet"
        href="css/registration.css"
    >

</head>


<body>


<div class="registration-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="registration-header">

        <button
            type="button"
            class="back-button"
            onclick="goBack()"
            aria-label="กลับ"
        >

            ← กลับ

        </button>


        <div class="header-title">

            <div class="header-title-main">
                ลงทะเบียนเรียน
            </div>

            <div class="header-title-sub">
                COURSE REGISTRATION
            </div>

        </div>


        <div class="header-space"></div>

    </header>



    <!-- =========================================
         MAIN
    ========================================= -->

    <main class="registration-main">


        <!-- =====================================
             STUDENT INFORMATION
        ====================================== -->

        <section class="registration-card student-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    ข้อมูลนักศึกษา
                </span>

            </div>


            <div class="student-profile">


                <div class="student-photo-wrap">

                    <img
                        id="studentPhoto"
                        src=""
                        alt="รูปนักศึกษา"
                    >

                </div>


                <div class="student-profile-info">


                    <div
                        id="studentFullName"
                        class="student-full-name"
                    >
                        -
                    </div>


                    <div
                        id="studentFullNameEn"
                        class="student-full-name-en"
                    >
                        -
                    </div>


                    <div class="student-detail-grid">


                        <div class="student-detail-item">

                            <span class="student-detail-label">
                                รหัสนักศึกษา
                            </span>

                            <strong id="studentId">
                                -
                            </strong>

                        </div>


                        <div class="student-detail-item">

                            <span class="student-detail-label">
                                สาขาวิชา
                            </span>

                            <strong id="studentDepartment">
                                -
                            </strong>

                        </div>


                        <div class="student-detail-item">

                            <span class="student-detail-label">
                                สถานะ
                            </span>

                            <strong id="studentStatus">
                                -
                            </strong>

                        </div>


                    </div>

                </div>

            </div>


        </section>



        <!-- =====================================
             COURSE SEARCH
        ====================================== -->

        <section class="registration-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    ค้นหารายวิชา
                </span>

            </div>


            <div class="search-help">

                พิมพ์รหัสวิชา เช่น
                <strong>21910-1001</strong>
                แล้วกดค้นหา

            </div>


            <div class="course-search-box">


                <input
                    id="courseSearchInput"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    placeholder="กรอกรหัสวิชา"
                    aria-label="รหัสวิชา"
                    onkeydown="handleSearchKeydown(event)"
                >


                <button
                    id="courseSearchButton"
                    type="button"
                    onclick="searchCourses()"
                >

                    🔍 ค้นหา

                </button>

            </div>


            <div
                id="searchMessage"
                class="search-message"
            ></div>


            <div
                id="courseSearchResults"
                class="course-search-results"
            >

                <div class="empty-state">
                    พิมพ์รหัสวิชาเพื่อค้นหารายวิชา
                </div>

            </div>


        </section>



        <!-- =====================================
             SELECTED COURSES
        ====================================== -->

        <section class="registration-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    รายการที่เลือก
                </span>

            </div>


            <div
                id="selectedList"
                class="selected-list"
            >

                <div class="empty-state">
                    ยังไม่ได้เลือกรายวิชา
                </div>

            </div>


            <div class="selected-footer">


                <div class="selected-count-box">

                    <span>
                        จำนวนวิชา
                    </span>


                    <strong id="selectedCount">
                        0
                    </strong>

                </div>


                <button
                    id="previewButton"
                    type="button"
                    class="preview-button"
                    onclick="previewRegistration()"
                >

                    ตรวจสอบรายการ

                </button>


            </div>


        </section>



        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
            id="message"
            class="message"
        ></div>


    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="registration-footer">

        Student Card System

    </footer>


</div>


<script src="js/config.js"></script>

<script src="js/registration.js"></script>


</body>

</html>
