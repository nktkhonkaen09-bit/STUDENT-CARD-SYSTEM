<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>ลงทะเบียนเรียน</title>

    <link
        rel="stylesheet"
        href="css/registration.css"
    >

</head>


<body>


<div class="registration-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="registration-header">


        <button
            type="button"
            class="back-button"
            onclick="goBack()"
            aria-label="กลับ"
        >
            ← กลับ
        </button>


        <div class="header-title">

            <div class="header-title-main">
                ลงทะเบียนเรียน
            </div>

            <div class="header-title-sub">
                COURSE REGISTRATION
            </div>

        </div>


        <div class="header-space"></div>


    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="registration-main">


        <!-- STUDENT -->

        <section class="student-summary">

            <div class="summary-icon">
                🎓
            </div>


            <div>

                <div
                    id="studentName"
                    class="summary-name"
                >
                    -
                </div>


                <div
                    id="studentId"
                    class="summary-id"
                >
                    รหัส -
                </div>

            </div>

        </section>



        <!-- COURSE -->

        <section class="registration-card">


            <div class="section-title">

                <span class="section-line"></span>

                <span>
                    รายวิชาที่เปิดให้ลงทะเบียน
                </span>

            </div>


            <div
                id="courseList"
                class="course-list"
            >

                <div class="loading">
                    กำลังโหลดรายวิชา...
                </div>

            </div>


        </section>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


    </main>



    <!-- FOOTER -->

    <footer class="registration-footer">

        Student Card System

    </footer>


</div>


<script src="js/config.js"></script>

<script src="js/registration.js"></script>


</body>

</html>
