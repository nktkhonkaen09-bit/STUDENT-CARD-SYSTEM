<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>บัตรนักศึกษา</title>

    <link
        rel="stylesheet"
        href="css/student-card.css"
    >

</head>


<body>


    <!-- =====================================================
         ปุ่มควบคุม
    ====================================================== -->

    <div class="card-controls">

        <button
            type="button"
            class="btn-back"
            onclick="goBack()"
        >
            ← กลับ
        </button>


        <button
            type="button"
            class="btn-download"
            onclick="downloadCard()"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>



    <!-- =====================================================
         บัตรนักศึกษา
    ====================================================== -->

    <div
        id="studentCard"
        class="student-card"
    >


        <!-- =================================================
             Background บัตรนักศึกษา
        ================================================== -->

        <img
            class="card-background"
            src="https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/STD-BG.png"
            alt="Student Card Background"
        >


        <!-- =================================================
             รูปนักศึกษา
        ================================================== -->

        <div
            class="student-photo-box"
            id="studentPhotoBox"
        >

            <img
                id="studentPhoto"
                class="student-photo"
                alt="รูปนักศึกษา"
            >

        </div>



        <!-- =================================================
             ข้อมูลนักศึกษา
        ================================================== -->

        <div class="student-information">


            <!-- รหัสนักศึกษา -->

            <div
                id="studentId"
                class="student-id"
            >
                -
            </div>


            <!-- ชื่อภาษาไทย -->

            <div
                id="studentName"
                class="student-name"
            >
                -
            </div>


            <!-- ชื่อภาษาอังกฤษ -->

            <div
                id="studentNameEn"
                class="student-name-en"
            >
                -
            </div>


            <!-- สาขาวิชา -->

            <div class="info-row">

                <span class="info-label">
                    สาขาวิชา
                </span>

                <span
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <!-- สถานะ -->

            <div class="info-row">

                <span class="info-label">
                    สถานะ
                </span>

                <span
                    id="studentStatus"
                    class="info-value"
                >
                    -
                </span>

            </div>

        </div>



        <!-- =================================================
             วันที่ออกบัตร / วันหมดอายุ
        ================================================== -->

        <div class="issue-information">


            <div class="date-box">

                <span class="date-label">
                    วันออกบัตร
                </span>

                <span
                    id="issueDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


            <div class="date-box">

                <span class="date-label">
                    วันหมดอายุ
                </span>

                <span
                    id="expireDate"
                    class="date-value"
                >
                    -
                </span>

            </div>

        </div>


    </div>
    <!-- จบ student-card -->



    <!-- =====================================================
         QR CODE
         อยู่นอกบัตร
    ====================================================== -->

    <div class="qr-area">


        <canvas
            id="studentQR"
            class="student-qr"
        ></canvas>


        <div class="qr-label">
            QR Code รหัสนักศึกษา
        </div>


    </div>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="js/config.js"></script>


    <!-- QR Code Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"
    ></script>


    <!-- html2canvas -->

    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    ></script>


    <!-- Student Card -->

    <script src="js/student-card.js"></script>


</body>

</html>
