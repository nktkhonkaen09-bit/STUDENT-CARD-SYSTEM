<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>บัตรนักศึกษา</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >


    <style>

        body {
            margin: 0;
            background: #f1f5f9;
            font-family: Arial, "Noto Sans Thai", sans-serif;
        }


        .card-page {
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }


        .card-header {
            max-width: 500px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }


        .card-header h2 {
            margin: 0;
        }


        .back-button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }


        /*
         * =========================================
         * บัตรนักศึกษา
         * =========================================
         */

        #studentCard {

            position: relative;

            width: 100%;

            max-width: 430px;

            aspect-ratio: 1.586 / 1;

            margin: 20px auto;

            overflow: hidden;

            border-radius: 16px;

            background-image:
                url(
                    "https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/STD-BG.png"
                );

            background-size: cover;

            background-position: center;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.20);

        }


        /*
         * =========================================
         * รูปนักศึกษา
         * =========================================
         */

        #studentPhoto {

            position: absolute;

            left: 7%;

            top: 27%;

            width: 25%;

            aspect-ratio: 0.78;

            object-fit: cover;

            border-radius: 6px;

            background: #eeeeee;

        }


        /*
         * =========================================
         * รหัสนักศึกษา
         * =========================================
         */

        .student-id {

            position: absolute;

            top: 43%;

            left: 0;

            width: 100%;

            text-align: center;

            font-size: 18px;

            font-weight: bold;

            color: #000;

        }


        /*
         * =========================================
         * ชื่อภาษาไทย
         * =========================================
         */

        .student-name {

            position: absolute;

            left: 35%;

            top: 29%;

            width: 60%;

            font-size: 18px;

            font-weight: bold;

            color: #000;

        }


        /*
         * =========================================
         * ชื่อภาษาอังกฤษ
         * =========================================
         */

        .student-name-en {

            position: absolute;

            left: 35%;

            top: 38%;

            width: 60%;

            font-size: 13px;

            color: #000;

        }


        /*
         * =========================================
         * สาขา
         * =========================================
         */

        .student-department {

            position: absolute;

            left: 35%;

            top: 47%;

            width: 60%;

            font-size: 13px;

            color: #000;

        }


        /*
         * =========================================
         * สถานะ
         * =========================================
         */

        .student-status {

            position: absolute;

            left: 35%;

            top: 55%;

            width: 60%;

            font-size: 13px;

            color: #000;

        }


        /*
         * =========================================
         * วันที่
         * =========================================
         */

        .issue-date {

            position: absolute;

            left: 8%;

            bottom: 9%;

            font-size: 11px;

        }


        .expire-date {

            position: absolute;

            right: 8%;

            bottom: 9%;

            font-size: 11px;

        }


        /*
         * =========================================
         * BARCODE
         * =========================================
         */

        .barcode-area {

            position: absolute;

            left: 52%;

            bottom: 7%;

            width: 40%;

            background: white;

            padding: 3px;

            box-sizing: border-box;

        }


        #studentBarcode {

            width: 100%;

            height: 42px;

        }


        #barcodeStudentId {

            display: block;

            text-align: center;

            font-size: 10px;

            font-weight: bold;

        }


        /*
         * =========================================
         * QR
         * =========================================
         */

        .qr-area {

            margin: 25px auto;

            text-align: center;

        }


        #studentQR {

            width: 180px;

            height: 180px;

            background: white;

            padding: 8px;

            border-radius: 8px;

            box-sizing: border-box;

        }


        .qr-title {

            margin-top: 8px;

            font-weight: bold;

        }


        /*
         * =========================================
         * ปุ่ม
         * =========================================
         */

        .card-actions {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 15px;

        }


        .card-actions button {

            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            background: #2563eb;

        }


        @media (max-width: 480px) {

            .card-page {
                padding: 10px;
            }

            .student-name {
                font-size: 15px;
            }

            .student-name-en {
                font-size: 11px;
            }

            .student-department,
            .student-status {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


<div class="card-page">


    <div class="card-header">

        <h2>
            บัตรนักศึกษา
        </h2>


        <button
            class="back-button"
            onclick="goBack()"
        >
            กลับ
        </button>

    </div>



    <!-- =================================================
         STUDENT CARD
         ================================================= -->

    <div id="studentCard">


        <!-- รูปนักศึกษา -->

        <img
            id="studentPhoto"
            src=""
            alt="รูปนักศึกษา"
        >


        <!-- รหัสนักศึกษา -->

        <div
            id="studentId"
            class="student-id"
        >
            -
        </div>


        <!-- ชื่อไทย -->

        <div
            id="studentName"
            class="student-name"
        >
            -
        </div>


        <!-- ชื่ออังกฤษ -->

        <div
            id="studentNameEn"
            class="student-name-en"
        >
            -
        </div>


        <!-- สาขา -->

        <div
            id="studentDepartment"
            class="student-department"
        >
            -
        </div>


        <!-- สถานะ -->

        <div
            id="studentStatus"
            class="student-status"
        >
            -
        </div>


        <!-- วันที่ออกบัตร -->

        <div
            id="issueDate"
            class="issue-date"
        >
            -
        </div>


        <!-- วันหมดอายุ -->

        <div
            id="expireDate"
            class="expire-date"
        >
            -
        </div>


        <!-- Barcode -->

        <div class="barcode-area">

            <svg
                id="studentBarcode"
            ></svg>

            <span
                id="barcodeStudentId"
            ></span>

        </div>


    </div>



    <!-- =================================================
         QR CODE
         ================================================= -->

    <div class="qr-area">

        <canvas
            id="studentQR"
        ></canvas>


        <div class="qr-title">

            QR Code รหัสนักศึกษา

        </div>

    </div>



    <!-- =================================================
         BUTTON
         ================================================= -->

    <div class="card-actions">

        <button
            onclick="downloadCard()"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>


</div>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="js/config.js"></script>


<script
    src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js">
</script>


<script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js">
</script>


<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
</script>


<script src="js/student-card.js"></script>


</body>

</html>
