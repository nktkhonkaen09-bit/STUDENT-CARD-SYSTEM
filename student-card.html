<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>บัตรนักศึกษา</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                #eef2f7;

            font-family:
                Arial,
                "Noto Sans Thai",
                sans-serif;

            color: #111827;

        }


        /* =========================================
           PAGE
           ========================================= */

        .card-page {

            min-height: 100vh;

            padding: 20px;

        }


        /* =========================================
           HEADER
           ========================================= */

        .card-header {

            width: 100%;

            max-width: 500px;

            margin:
                0 auto 20px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

        }


        .card-header h2 {

            margin: 0;

            font-size: 22px;

        }


        .back-button {

            border: none;

            background:
                #2563eb;

            color: white;

            padding:
                10px 18px;

            border-radius:
                8px;

            cursor: pointer;

            font-size: 14px;

        }


        .back-button:active {

            transform:
                scale(0.97);

        }


        /* =========================================
           STUDENT CARD
           ========================================= */

        #studentCard {

            position: relative;

            width: 100%;

            max-width: 430px;

            aspect-ratio:
                1.586 / 1;

            margin:
                0 auto;

            overflow: hidden;

            border-radius:
                16px;

            background-color:
                white;

            background-image:

                url(
                    "https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/STD-BG.png"
                );

            background-size:
                cover;

            background-position:
                center;

            box-shadow:

                0 10px 30px
                rgba(0,0,0,0.20);

        }


        /* =========================================
           STUDENT PHOTO
           ========================================= */

        #studentPhoto {

            position: absolute;

            left: 7%;

            top: 27%;

            width: 25%;

            aspect-ratio:
                0.78;

            object-fit:
                cover;

            border-radius:
                6px;

            background:
                #eeeeee;

        }


        /* =========================================
           STUDENT ID
           ========================================= */

        .student-id {

            position: absolute;

            left: 0;

            top: 44%;

            width: 100%;

            text-align:
                center;

            font-size:
                18px;

            font-weight:
                bold;

            color:
                #000000;

        }


        /* =========================================
           THAI NAME
           ========================================= */

        .student-name {

            position: absolute;

            left: 35%;

            top: 29%;

            width: 60%;

            font-size:
                17px;

            font-weight:
                bold;

            color:
                #000000;

        }


        /* =========================================
           ENGLISH NAME
           ========================================= */

        .student-name-en {

            position: absolute;

            left: 35%;

            top: 38%;

            width: 60%;

            font-size:
                12px;

            color:
                #000000;

        }


        /* =========================================
           DEPARTMENT
           ========================================= */

        .student-department {

            position: absolute;

            left: 35%;

            top: 47%;

            width: 60%;

            font-size:
                12px;

            color:
                #000000;

        }


        /* =========================================
           STATUS
           ========================================= */

        .student-status {

            position: absolute;

            left: 35%;

            top: 55%;

            width: 60%;

            font-size:
                12px;

            color:
                #000000;

        }


        /* =========================================
           ISSUE DATE
           ========================================= */

        .issue-date {

            position: absolute;

            left: 8%;

            bottom: 8%;

            font-size:
                10px;

            color:
                #000000;

        }


        /* =========================================
           EXPIRE DATE
           ========================================= */

        .expire-date {

            position: absolute;

            right: 8%;

            bottom: 8%;

            font-size:
                10px;

            color:
                #000000;

        }


        /* =========================================
           BARCODE
           ========================================= */

        .barcode-area {

            position: absolute;

            left: 52%;

            bottom: 5%;

            width: 40%;

            padding: 3px;

            background:
                white;

            border-radius:
                3px;

        }


        #studentBarcode {

            display: block;

            width: 100%;

            height: 40px;

        }


        #barcodeStudentId {

            display: block;

            text-align:
                center;

            font-size:
                9px;

            font-weight:
                bold;

            color:
                #000000;

        }


        /* =========================================
           QR AREA
           ========================================= */

        .qr-area {

            width: 100%;

            text-align:
                center;

            margin-top:
                25px;

            margin-bottom:
                20px;

        }


        #studentQR {

            width:
                220px;

            height:
                220px;

            display:
                block;

            margin:
                0 auto;

            padding:
                8px;

            background:
                white;

            border-radius:
                10px;

            object-fit:
                contain;

            cursor:
                pointer;

            box-shadow:

                0 4px 15px
                rgba(0,0,0,0.12);

        }


        .qr-title {

            margin-top:
                10px;

            font-size:
                15px;

            font-weight:
                bold;

        }


        .qr-hint {

            margin-top:
                5px;

            font-size:
                12px;

            color:
                #6b7280;

        }


        /* =========================================
           BUTTONS
           ========================================= */

        .card-actions {

            display:
                flex;

            justify-content:
                center;

            gap:
                10px;

            margin-top:
                20px;

        }


        .card-actions button {

            border:
                none;

            padding:
                11px 20px;

            border-radius:
                8px;

            background:
                #2563eb;

            color:
                white;

            font-size:
                14px;

            cursor:
                pointer;

        }


        /* =========================================
           FULL SCREEN QR
           ========================================= */

        #qrOverlay {

            position:
                fixed;

            inset:
                0;

            z-index:
                99999;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            background:
                rgba(0,0,0,0.94);

            padding:
                20px;

        }


        #qrOverlay.show {

            display:
                flex;

        }


        #qrFull {

            width:
                min(90vw, 500px);

            height:
                min(90vw, 500px);

            background:
                white;

            padding:
                15px;

            border-radius:
                15px;

            object-fit:
                contain;

        }


        .qr-close {

            position:
                absolute;

            top:
                20px;

            right:
                20px;

            width:
                45px;

            height:
                45px;

            border:
                none;

            border-radius:
                50%;

            background:
                white;

            color:
                #111827;

            font-size:
                25px;

            cursor:
                pointer;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (
            max-width: 480px
        ) {

            .card-page {

                padding:
                    10px;

            }


            .card-header h2 {

                font-size:
                    19px;

            }


            .student-name {

                font-size:
                    14px;

            }


            .student-name-en {

                font-size:
                    10px;

            }


            .student-department,
            .student-status {

                font-size:
                    10px;

            }


            .student-id {

                font-size:
                    16px;

            }


            #studentQR {

                width:
                    200px;

                height:
                    200px;

            }

        }

    </style>

</head>


<body>


<div class="card-page">


    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="card-header">

        <h2>
            บัตรนักศึกษา
        </h2>


        <button
            class="back-button"
            onclick="goBack()"
        >
            กลับ
        </button>

    </div>



    <!-- =========================================
         STUDENT CARD
         ========================================= -->

    <div id="studentCard">


        <!-- รูปนักศึกษา -->

        <img
            id="studentPhoto"
            src=""
            alt="รูปนักศึกษา"
        >


        <!-- รหัสนักศึกษา -->

        <div
            id="studentId"
            class="student-id"
        >
            -
        </div>


        <!-- ชื่อไทย -->

        <div
            id="studentName"
            class="student-name"
        >
            -
        </div>


        <!-- ชื่ออังกฤษ -->

        <div
            id="studentNameEn"
            class="student-name-en"
        >
            -
        </div>


        <!-- สาขาวิชา -->

        <div
            id="studentDepartment"
            class="student-department"
        >
            -
        </div>


        <!-- สถานะ -->

        <div
            id="studentStatus"
            class="student-status"
        >
            -
        </div>


        <!-- วันออกบัตร -->

        <div
            id="issueDate"
            class="issue-date"
        >
            -
        </div>


        <!-- วันหมดอายุ -->

        <div
            id="expireDate"
            class="expire-date"
        >
            -
        </div>


        <!-- BARCODE -->

        <div class="barcode-area">

            <svg
                id="studentBarcode"
            ></svg>


            <span
                id="barcodeStudentId"
            ></span>

        </div>


    </div>



    <!-- =========================================
         QR CODE
         ========================================= -->

    <div class="qr-area">


        <img
            id="studentQR"
            src=""
            alt="QR Code รหัสนักศึกษา"
        >


        <div class="qr-title">

            QR Code รหัสนักศึกษา

        </div>


        <div class="qr-hint">

            แตะ QR Code เพื่อขยายเต็มหน้าจอ

        </div>


    </div>



    <!-- =========================================
         ACTIONS
         ========================================= -->

    <div class="card-actions">

        <button
            onclick="downloadCard()"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>


</div>



<!-- =============================================
     QR FULL SCREEN
     ============================================= -->

<div
    id="qrOverlay"
    onclick="closeQR()"
>


    <button
        class="qr-close"
        onclick="event.stopPropagation(); closeQR();"
    >
        ×
    </button>


    <img
        id="qrFull"
        src=""
        alt="QR Code"
        onclick="event.stopPropagation();"
    >

</div>



<!-- =============================================
     JAVASCRIPT
     ============================================= -->

<script
    src="js/config.js"
></script>


<script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"
></script>


<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<script
    src="js/student-card.js"
></script>


</body>

</html>
