<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f5a900"
    >

    <title>บัตรนักศึกษา</title>


    <!-- ==============================
         FONT
         ============================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #eef1f5;

            font-family:
                "Noto Sans Thai",
                Arial,
                sans-serif;

            color: #111827;

        }


        /* =========================================
           PAGE
           ========================================= */

        .card-page {

            width: 100%;

            min-height: 100vh;

            padding: 15px;

        }


        /* =========================================
           CARD
           ========================================= */

        #studentCard {

            position: relative;

            width: 100%;

            max-width: 1000px;

            aspect-ratio: 1000 / 632;

            margin: 0 auto;

            overflow: hidden;

            /*
             * ใช้ STD-BG.png เป็นพื้นหลัง
             */

            background-image:

                url(
                    "https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/STD-BG.png"
                );

            background-size: 100% 100%;

            background-position: center;

            background-repeat: no-repeat;

            border-radius: 14px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.18);

        }


        /* =========================================
           STUDENT PHOTO
           ========================================= */

        #studentPhoto {

            position: absolute;

            left: 5.4%;

            top: 24.7%;

            width: 29.1%;

            height: 57.4%;

            object-fit: cover;

            object-position: center;

            background: #eeeeee;

            border: 3px solid #10208c;

        }


        /* =========================================
           INFORMATION
           
           เรียง:
           1. รหัส
           2. ชื่อ-สกุล
           3. สาขาวิชา
           4. สถานะ
           ========================================= */

        .student-info {

            position: absolute;

            left: 38.0%;

            top: 36.5%;

            width: 56%;

            color: #000000;

        }


        .info-row {

            display: flex;

            align-items: baseline;

            width: 100%;

            margin-bottom: 2.2%;

            line-height: 1.25;

        }


        .info-label {

            flex: 0 0 auto;

            margin-right: 12px;

            font-size:
                clamp(
                    11px,
                    1.65vw,
                    22px
                );

            font-weight: 600;

            white-space: nowrap;

        }


        .info-value {

            min-width: 0;

            font-size:
                clamp(
                    11px,
                    1.65vw,
                    22px
                );

            font-weight: 400;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* รหัสนักศึกษา */

        #studentId {

            font-weight: 600;

        }


        /* ชื่อ-สกุล */

        #studentName {

            font-weight: 500;

        }


        /* =========================================
           DATE
           
           อยู่ใต้รูป
           ========================================= */

        .date-area {

            position: absolute;

            left: 5.4%;

            top: 84.0%;

            width: 29.1%;

            display: flex;

            justify-content: space-between;

            gap: 8px;

        }


        .date-box {

            flex: 1;

            text-align: center;

            color: #000000;

            line-height: 1.3;

        }


        .date-title {

            display: block;

            font-size:
                clamp(
                    8px,
                    1.15vw,
                    14px
                );

            font-weight: 600;

        }


        .date-value {

            display: block;

            font-size:
                clamp(
                    8px,
                    1.15vw,
                    14px
                );

            font-weight: 400;

        }


        /* =========================================
           BARCODE
           ========================================= */

        .barcode-area {

            position: absolute;

            left: 55%;

            top: 78.5%;

            width: 34%;

            height: 13%;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        #studentBarcode {

            display: block;

            width: 100%;

            height: 100%;

        }


        #barcodeStudentId {

            display: none;

        }


        /* =========================================
           QR AREA
           ========================================= */

        .qr-area {

            width: 100%;

            max-width: 1000px;

            margin: 25px auto 20px;

            text-align: center;

        }


        #studentQR {

            display: block;

            width: 220px;

            height: 220px;

            margin: 0 auto;

            padding: 8px;

            background: #ffffff;

            border-radius: 12px;

            object-fit: contain;

            cursor: pointer;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.16);

        }


        .qr-title {

            margin-top: 10px;

            font-size: 16px;

            font-weight: 600;

        }


        .qr-hint {

            margin-top: 4px;

            font-size: 12px;

            color: #6b7280;

        }


        /* =========================================
           DOWNLOAD BUTTON
           ========================================= */

        .card-actions {

            display: flex;

            justify-content: center;

            margin: 20px auto 30px;

        }


        .card-actions button {

            border: none;

            background: #f5a900;

            color: #ffffff;

            padding: 11px 25px;

            border-radius: 8px;

            font-family:
                "Noto Sans Thai",
                sans-serif;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

        }


        .card-actions button:active {

            transform: scale(0.97);

        }


        /* =========================================
           QR FULL SCREEN
           ========================================= */

        #qrOverlay {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(0, 0, 0, 0.94);

            padding: 20px;

        }


        #qrOverlay.show {

            display: flex;

        }


        #qrFull {

            width:
                min(90vw, 550px);

            height:
                min(90vw, 550px);

            padding: 15px;

            background: #ffffff;

            border-radius: 15px;

            object-fit: contain;

        }


        .qr-close {

            position: absolute;

            top: 20px;

            right: 20px;

            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            background: #ffffff;

            color: #111827;

            font-size: 28px;

            line-height: 1;

            cursor: pointer;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .card-page {

                padding: 8px;

            }


            #studentCard {

                border-radius: 8px;

            }


            #studentPhoto {

                border-width: 2px;

            }


            .info-label {

                margin-right: 6px;

            }


            .info-row {

                margin-bottom: 2%;

            }


            #studentQR {

                width: 200px;

                height: 200px;

            }

        }

    </style>

</head>


<body>


<div class="card-page">


    <!-- =========================================
         STUDENT CARD
         
         ไม่มีหัวข้อ "บัตรนักศึกษา" ด้านบนซ้าย
         ========================================= -->

    <div id="studentCard">


        <!-- =====================================
             PHOTO
             ===================================== -->

        <img
            id="studentPhoto"
            src=""
            alt="รูปนักศึกษา"
        >


        <!-- =====================================
             INFORMATION
             
             รหัส
             ชื่อ-สกุล
             สาขาวิชา
             สถานะ
             ===================================== -->

        <div class="student-info">


            <!-- รหัส -->

            <div class="info-row">

                <span class="info-label">
                    รหัส
                </span>

                <span
                    id="studentId"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <!-- ชื่อ-สกุล -->

            <div class="info-row">

                <span class="info-label">
                    ชื่อ-สกุล
                </span>

                <span
                    id="studentName"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <!-- สาขาวิชา -->

            <div class="info-row">

                <span class="info-label">
                    สาขาวิชา
                </span>

                <span
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <!-- สถานะ -->

            <div class="info-row">

                <span class="info-label">
                    สถานะ
                </span>

                <span
                    id="studentStatus"
                    class="info-value"
                >
                    -
                </span>

            </div>


        </div>


        <!-- =====================================
             DATE
             
             อยู่ใต้รูป
             ===================================== -->

        <div class="date-area">


            <div class="date-box">

                <span class="date-title">
                    วันออกบัตร
                </span>

                <span
                    id="issueDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


            <div class="date-box">

                <span class="date-title">
                    วันหมดอายุ
                </span>

                <span
                    id="expireDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


        </div>


        <!-- =====================================
             BARCODE
             ===================================== -->

        <div class="barcode-area">

            <svg
                id="studentBarcode"
            ></svg>

            <span
                id="barcodeStudentId"
            ></span>

        </div>


    </div>


    <!-- =========================================
         QR CODE
         ========================================= -->

    <div class="qr-area">


        <img
            id="studentQR"
            src=""
            alt="QR Code รหัสนักศึกษา"
        >


        <div class="qr-title">
            QR Code รหัสนักศึกษา
        </div>


        <div class="qr-hint">
            แตะ QR Code เพื่อขยายเต็มหน้าจอ
        </div>


    </div>


    <!-- =========================================
         DOWNLOAD
         ========================================= -->

    <div class="card-actions">

        <button
            type="button"
            onclick="downloadCard()"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>


</div>


<!-- =============================================
     QR FULL SCREEN
     ============================================= -->

<div
    id="qrOverlay"
    onclick="closeQR()"
>


    <button
        type="button"
        class="qr-close"
        onclick="
            event.stopPropagation();
            closeQR();
        "
    >
        ×
    </button>


    <img
        id="qrFull"
        src=""
        alt="QR Code"
        onclick="
            event.stopPropagation();
        "
    >

</div>


<!-- =============================================
     JAVASCRIPT
     ============================================= -->

<script src="js/config.js"></script>


<script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"
></script>


<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<script src="js/student-card.js"></script>


</body>

</html>
