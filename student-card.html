<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>บัตรนักศึกษา</title>


    <!-- CSS หลัก -->
    <link
        rel="stylesheet"
        href="css/student-card.css"
    >

</head>


<body>


    <!-- =====================================================
         ส่วนควบคุม
    ====================================================== -->

    <div class="card-controls">

        <button
            type="button"
            onclick="goBack()"
            class="btn-back"
        >
            ← กลับ
        </button>


        <button
            type="button"
            onclick="downloadCard()"
            class="btn-download"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>



    <!-- =====================================================
         บัตรนักศึกษา
    ====================================================== -->

    <div
        id="studentCard"
        class="student-card"
    >


        <!-- =================================================
             Background
        ================================================== -->

        <img
            class="card-background"
            src="https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/STD-BG.png"
            alt="Student Card Background"
        >



        <!-- =================================================
             รูปนักศึกษา
        ================================================== -->

        <div class="student-photo-box">

            <img
                id="studentPhoto"
                class="student-photo"
                alt="รูปนักศึกษา"
            >

        </div>



        <!-- =================================================
             ข้อมูลนักศึกษา
        ================================================== -->

        <div class="student-information">


            <!-- รหัสนักศึกษา -->

            <div
                id="studentId"
                class="student-id"
            >
                -
            </div>


            <!-- ชื่อภาษาไทย -->

            <div
                id="studentName"
                class="student-name"
            >
                -
            </div>


            <!-- ชื่อภาษาอังกฤษ -->

            <div
                id="studentNameEn"
                class="student-name-en"
            >
                -
            </div>


            <!-- สาขาวิชา -->

            <div class="info-row">

                <span class="info-label">
                    สาขาวิชา
                </span>

                <span
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <!-- สถานะ -->

            <div class="info-row">

                <span class="info-label">
                    สถานะ
                </span>

                <span
                    id="studentStatus"
                    class="info-value"
                >
                    -
                </span>

            </div>


        </div>



        <!-- =================================================
             วันที่ออกบัตร
        ================================================== -->

        <div class="issue-information">

            <div class="date-box">

                <span class="date-label">
                    วันออกบัตร
                </span>

                <span
                    id="issueDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


            <div class="date-box">

                <span class="date-label">
                    วันหมดอายุ
                </span>

                <span
                    id="expireDate"
                    class="date-value"
                >
                    -
                </span>

            </div>

        </div>



        <!-- =================================================
             QR CODE
        ================================================== -->

        <div class="qr-area">

            <canvas
                id="studentQR"
                class="student-qr"
            ></canvas>


            <div class="qr-label">
                QR ตรวจสอบข้อมูล
            </div>

        </div>


    </div>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="js/config.js"></script>


    <!-- QR Code -->

    <script
        src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"
    ></script>


    <!-- HTML2Canvas -->

    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    ></script>


    <!-- Student Card -->

    <script src="js/student-card.js"></script>


</body>

</html>
