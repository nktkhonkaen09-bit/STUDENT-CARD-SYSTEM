<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>บัตรนักศึกษา</title>

    <link
        rel="stylesheet"
        href="css/student-card.css"
    >

</head>


<body>


    <!-- =====================================================
         ปุ่มควบคุม
    ====================================================== -->

    <div class="card-controls">

        <button
            type="button"
            class="btn-back"
            onclick="goBack()"
        >
            ← กลับ
        </button>


        <button
            type="button"
            class="btn-download"
            onclick="downloadCard()"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>



    <!-- =====================================================
         บัตรนักศึกษา
    ====================================================== -->

    <div
        id="studentCard"
        class="student-card"
    >


        <!-- Background -->

        <img
            class="card-background"
            src="https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/STD-BG.png"
            alt="Student Card Background"
        >


        <!-- =================================================
             รูปนักศึกษา
        ================================================== -->

        <div
            class="student-photo-box"
            id="studentPhotoBox"
        >

            <img
                id="studentPhoto"
                class="student-photo"
                alt="รูปนักศึกษา"
            >

        </div>



        <!-- =================================================
             ข้อมูลนักศึกษา
        ================================================== -->

        <div class="student-information">


            <!-- รหัสนักศึกษา -->

            <div
                id="studentId"
                class="student-id"
            >
                -
            </div>


            <!-- ชื่อภาษาไทย -->

            <div
                id="studentName"
                class="student-name"
            >
                -
            </div>


            <!-- ชื่อภาษาอังกฤษ -->

            <div
                id="studentNameEn"
                class="student-name-en"
            >
                -
            </div>


            <!-- สาขาวิชา -->

            <div class="info-row">

                <span class="info-label">
                    สาขาวิชา
                </span>

                <span
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <!-- สถานะ -->

            <div class="info-row">

                <span class="info-label">
                    สถานะ
                </span>

                <span
                    id="studentStatus"
                    class="info-value"
                >
                    -
                </span>

            </div>


        </div>



        <!-- =================================================
             วันที่
        ================================================== -->

        <div class="issue-information">


            <div class="date-box">

                <span class="date-label">
                    วันออกบัตร
                </span>

                <span
                    id="issueDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


            <div class="date-box">

                <span class="date-label">
                    วันหมดอายุ
                </span>

                <span
                    id="expireDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


        </div>


    </div>
    <!-- จบ student-card -->



    <!-- =====================================================
         QR CODE
    ====================================================== -->

    <div class="qr-area">


        <div
            class="qr-click-area"
            onclick="openQRFullscreen()"
            title="แตะเพื่อขยาย QR Code"
        >

            <canvas
                id="studentQR"
                class="student-qr"
            ></canvas>

        </div>


        <div class="qr-label">
            QR Code รหัสนักศึกษา
        </div>


        <div class="qr-hint">
            แตะ QR Code เพื่อขยาย
        </div>


    </div>



    <!-- =====================================================
         BARCODE
    ====================================================== -->

    <div class="barcode-area">


        <div class="barcode-title">
            Barcode รหัสนักศึกษา
        </div>


        <svg
            id="studentBarcode"
            class="student-barcode"
        ></svg>


        <div
            id="barcodeStudentId"
            class="barcode-id"
        >
            -
        </div>


    </div>



    <!-- =====================================================
         QR FULLSCREEN
    ====================================================== -->

    <div
        id="qrFullscreen"
        class="qr-fullscreen"
        onclick="closeQRFullscreen()"
    >


        <div
            class="qr-fullscreen-content"
            onclick="event.stopPropagation()"
        >


            <button
                type="button"
                class="qr-close"
                onclick="closeQRFullscreen()"
            >
                ×
            </button>


            <canvas
                id="studentQRFullscreen"
                class="student-qr-fullscreen"
            ></canvas>


            <div class="qr-fullscreen-label">
                QR Code รหัสนักศึกษา
            </div>


            <div class="qr-fullscreen-id">

                <span id="qrStudentId">
                    -
                </span>

            </div>


        </div>


    </div>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="js/config.js"></script>


    <!-- QR Code -->

    <script
        src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"
    ></script>


    <!-- Barcode CODE128 -->

    <script
        src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"
    ></script>


    <!-- html2canvas -->

    <script
        src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    ></script>


    <!-- Student Card -->

    <script src="js/student-card.js"></script>


    <!-- =====================================================
         QR Fullscreen
    ====================================================== -->

    <script>

        function openQRFullscreen() {

            const fullscreen =
                document.getElementById(
                    "qrFullscreen"
                );

            const originalQR =
                document.getElementById(
                    "studentQR"
                );

            const fullscreenQR =
                document.getElementById(
                    "studentQRFullscreen"
                );


            if (
                !originalQR ||
                !fullscreenQR
            ) {

                return;

            }


            fullscreenQR.width = 600;

            fullscreenQR.height = 600;


            const context =
                fullscreenQR.getContext("2d");


            context.clearRect(
                0,
                0,
                600,
                600
            );


            context.imageSmoothingEnabled = false;


            context.drawImage(
                originalQR,
                0,
                0,
                600,
                600
            );


            const studentId =
                document.getElementById(
                    "studentId"
                );


            const qrStudentId =
                document.getElementById(
                    "qrStudentId"
                );


            if (
                studentId &&
                qrStudentId
            ) {

                qrStudentId.textContent =
                    studentId.textContent.trim();

            }


            fullscreen.classList.add(
                "show"
            );


            document.body.classList.add(
                "qr-open"
            );


            if (
                fullscreen.requestFullscreen
            ) {

                fullscreen
                    .requestFullscreen()
                    .catch(() => {});

            }

        }



        function closeQRFullscreen() {

            const fullscreen =
                document.getElementById(
                    "qrFullscreen"
                );


            fullscreen.classList.remove(
                "show"
            );


            document.body.classList.remove(
                "qr-open"
            );


            if (
                document.fullscreenElement
            ) {

                document
                    .exitFullscreen()
                    .catch(() => {});

            }

        }



        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape"
                ) {

                    closeQRFullscreen();

                }

            }
        );


        document.addEventListener(
            "fullscreenchange",
            function() {

                const fullscreen =
                    document.getElementById(
                        "qrFullscreen"
                    );


                if (
                    !document.fullscreenElement &&
                    fullscreen.classList.contains("show")
                ) {

                    fullscreen.classList.remove(
                        "show"
                    );

                    document.body.classList.remove(
                        "qr-open"
                    );

                }

            }
        );

    </script>


</body>

</html>
