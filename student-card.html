<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>บัตรนักศึกษา</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #eeeeee;

            font-family:
                Arial,
                "Noto Sans Thai",
                sans-serif;

            color: #000000;

        }


        /* =========================================
           PAGE
           ========================================= */

        .card-page {

            width: 100%;

            min-height: 100vh;

            padding: 15px;

        }


        /* =========================================
           HEADER
           ========================================= */

        .card-header {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        .card-header h2 {

            margin: 0;

            font-size: 22px;

        }


        .back-button {

            border: none;

            background: #f5a900;

            color: white;

            padding: 9px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

        }


        /* =========================================
           CARD
           อัตราส่วนเดียวกับภาพด้านหน้าวาง.png
           1000 : 632
           ========================================= */

        #studentCard {

            position: relative;

            width: 100%;

            max-width: 1000px;

            aspect-ratio: 1000 / 632;

            margin: 0 auto;

            overflow: hidden;

            background-image:

                url(
                    "https://raw.githubusercontent.com/nktkhonkaen09-bit/STUDENT-CARD-SYSTEM/main/assets/students/%E0%B8%94%E0%B9%89%E0%B8%B2%E0%B8%99%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%A7%E0%B8%B2%E0%B8%87.png"
                );

            background-size: 100% 100%;

            background-repeat: no-repeat;

            background-position: center;

        }


        /* =========================================
           PHOTO
           ตำแหน่งตามภาพตัวอย่าง
           ========================================= */

        #studentPhoto {

            position: absolute;

            left: 5.4%;

            top: 24.7%;

            width: 29.1%;

            height: 57.4%;

            object-fit: cover;

            object-position: center;

            background: #eeeeee;

            border: 3px solid #10208c;

        }


        /* =========================================
           STUDENT ID
           ========================================= */

        .student-id {

            position: absolute;

            left: 50%;

            top: 39.0%;

            width: 45%;

            text-align: center;

            font-size: clamp(
                18px,
                3vw,
                32px
            );

            font-weight: 500;

            color: #000000;

            line-height: 1.1;

        }


        /* =========================================
           INFORMATION AREA
           ========================================= */

        .student-info {

            position: absolute;

            left: 35.8%;

            top: 48.0%;

            width: 60%;

            font-size: clamp(
                12px,
                1.75vw,
                24px
            );

            line-height: 1.55;

            color: #000000;

        }


        .info-row {

            display: flex;

            width: 100%;

            white-space: nowrap;

        }


        .info-label {

            flex: 0 0 auto;

            margin-right: 20px;

        }


        .info-value {

            flex: 1;

            font-weight: 400;

        }


        /* =========================================
           DATE UNDER PHOTO
           ========================================= */

        .date-area {

            position: absolute;

            left: 5.4%;

            top: 84.0%;

            width: 29.1%;

            display: flex;

            justify-content: space-between;

            gap: 8px;

            text-align: center;

        }


        .date-box {

            flex: 1;

            font-size: clamp(
                8px,
                1.15vw,
                14px
            );

            color: #000000;

            line-height: 1.35;

        }


        .date-title {

            display: block;

            font-weight: bold;

        }


        .date-value {

            display: block;

        }


        /* =========================================
           BARCODE
           ========================================= */

        .barcode-area {

            position: absolute;

            left: 51.5%;

            top: 80.0%;

            width: 33%;

            height: 12%;

            background: transparent;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        #studentBarcode {

            width: 100%;

            height: 100%;

            display: block;

        }


        #barcodeStudentId {

            display: none;

        }


        /* =========================================
           QR AREA
           ========================================= */

        .qr-area {

            width: 100%;

            max-width: 1000px;

            margin: 25px auto 10px;

            text-align: center;

        }


        #studentQR {

            width: 220px;

            height: 220px;

            display: block;

            margin: 0 auto;

            padding: 8px;

            background: #ffffff;

            border-radius: 12px;

            object-fit: contain;

            cursor: pointer;

            box-shadow:
                0 4px 18px
                rgba(0,0,0,0.18);

        }


        .qr-title {

            margin-top: 10px;

            font-size: 16px;

            font-weight: bold;

        }


        .qr-hint {

            margin-top: 5px;

            color: #666666;

            font-size: 12px;

        }


        /* =========================================
           BUTTON
           ========================================= */

        .card-actions {

            display: flex;

            justify-content: center;

            margin: 20px auto;

        }


        .card-actions button {

            border: none;

            background: #f5a900;

            color: #ffffff;

            padding: 11px 25px;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

        }


        /* =========================================
           QR FULL SCREEN
           ========================================= */

        #qrOverlay {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;

            justify-content: center;

            background:
                rgba(0,0,0,0.94);

            padding: 20px;

        }


        #qrOverlay.show {

            display: flex;

        }


        #qrFull {

            width: min(90vw, 500px);

            height: min(90vw, 500px);

            padding: 15px;

            background: #ffffff;

            border-radius: 15px;

            object-fit: contain;

        }


        .qr-close {

            position: absolute;

            right: 20px;

            top: 20px;

            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            background: #ffffff;

            color: #000000;

            font-size: 28px;

            cursor: pointer;

        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .card-page {

                padding: 8px;

            }


            .card-header h2 {

                font-size: 18px;

            }


            .back-button {

                padding:
                    7px 13px;

                font-size:
                    12px;

            }


            #studentPhoto {

                border-width: 2px;

            }


            .student-info {

                line-height: 1.5;

            }


            .info-label {

                margin-right: 8px;

            }


            #studentQR {

                width: 200px;

                height: 200px;

            }

        }

    </style>

</head>


<body>


<div class="card-page">


    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="card-header">

        <h2>
            บัตรนักศึกษา
        </h2>


        <button
            class="back-button"
            onclick="goBack()"
        >
            กลับ
        </button>

    </div>


    <!-- =========================================
         STUDENT CARD
         ========================================= -->

    <div id="studentCard">


        <!-- รูปนักศึกษา -->

        <img
            id="studentPhoto"
            src=""
            alt="รูปนักศึกษา"
        >


        <!-- รหัสนักศึกษา -->

        <div
            id="studentId"
            class="student-id"
        >
            -
        </div>


        <!-- ข้อมูลนักศึกษา -->

        <div class="student-info">


            <div class="info-row">

                <span class="info-label">
                    ชื่อ-นามสกุล
                </span>

                <span
                    id="studentName"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    ระดับชั้น
                </span>

                <span
                    id="studentLevel"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    ประเภทวิชา
                </span>

                <span
                    id="studentType"
                    class="info-value"
                >
                    -
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    สาขาวิชา
                </span>

                <span
                    id="studentDepartment"
                    class="info-value"
                >
                    -
                </span>

            </div>


        </div>


        <!-- =====================================
             วันออกบัตร / วันหมดอายุ
             อยู่ใต้รูป
             ===================================== -->

        <div class="date-area">


            <div class="date-box">

                <span class="date-title">
                    วันออกบัตร
                </span>

                <span
                    id="issueDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


            <div class="date-box">

                <span class="date-title">
                    วันหมดอายุ
                </span>

                <span
                    id="expireDate"
                    class="date-value"
                >
                    -
                </span>

            </div>


        </div>


        <!-- =====================================
             BARCODE
             ===================================== -->

        <div class="barcode-area">

            <svg
                id="studentBarcode"
            ></svg>


            <span
                id="barcodeStudentId"
            >
            </span>

        </div>


    </div>


    <!-- =========================================
         QR CODE
         ========================================= -->

    <div class="qr-area">


        <img
            id="studentQR"
            src=""
            alt="QR Code รหัสนักศึกษา"
        >


        <div class="qr-title">

            QR Code รหัสนักศึกษา

        </div>


        <div class="qr-hint">

            แตะ QR Code เพื่อขยายเต็มหน้าจอ

        </div>


    </div>


    <!-- =========================================
         DOWNLOAD
         ========================================= -->

    <div class="card-actions">

        <button
            onclick="downloadCard()"
        >
            ดาวน์โหลดบัตร
        </button>

    </div>


</div>


<!-- =============================================
     QR FULL SCREEN
     ============================================= -->

<div
    id="qrOverlay"
    onclick="closeQR()"
>


    <button
        class="qr-close"
        onclick="
            event.stopPropagation();
            closeQR();
        "
    >
        ×
    </button>


    <img
        id="qrFull"
        src=""
        alt="QR Code"
        onclick="
            event.stopPropagation();
        "
    >

</div>


<!-- =============================================
     JAVASCRIPT
     ============================================= -->

<script src="js/config.js"></script>


<script
    src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"
></script>


<script
    src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
></script>


<script src="js/student-card.js"></script>


</body>

</html>
