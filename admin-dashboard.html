<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0a1383"
  >

  <title>
    Admin Dashboard | Student Card System
  </title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background:
        #f4f6fb;

      color:
        #111827;

    }


    /* =========================================
       HEADER
    ========================================= */

    .admin-header {

      min-height: 76px;

      padding:
        15px 30px;

      background:
        #0a1383;

      color:
        #ffffff;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        20px;

    }


    .admin-title {

      font-size:
        22px;

      font-weight:
        700;

      margin-bottom:
        4px;

    }


    .admin-subtitle {

      font-size:
        13px;

      opacity:
        .85;

    }


    .admin-user {

      display:
        flex;

      align-items:
        center;

      gap:
        15px;

      text-align:
        right;

    }


    .admin-role {

      font-size:
        11px;

      opacity:
        .75;

      margin-top:
        3px;

    }


    .logout-btn {

      border:
        1px solid
        rgba(255,255,255,.35);

      background:
        rgba(255,255,255,.12);

      color:
        #ffffff;

      padding:
        9px 15px;

      border-radius:
        8px;

      cursor:
        pointer;

      font-weight:
        600;

    }


    .logout-btn:hover {

      background:
        rgba(255,255,255,.2);

    }



    /* =========================================
       MAIN
    ========================================= */

    .admin-container {

      width:
        min(1500px, calc(100% - 30px));

      margin:
        25px auto 50px;

    }


    .message-box {

      min-height:
        24px;

      margin-bottom:
        15px;

      font-size:
        14px;

      font-weight:
        600;

    }


    .message-box.success {
      color:
        #15803d;
    }


    .message-box.error {
      color:
        #dc2626;
    }


    .message-box.info {
      color:
        #0a1383;
    }



    /* =========================================
       CARD
    ========================================= */

    .admin-card {

      background:
        #ffffff;

      border:
        1px solid #e1e5ef;

      border-radius:
        14px;

      margin-bottom:
        25px;

      box-shadow:
        0 5px 20px
        rgba(15,23,42,.06);

      overflow:
        hidden;

    }


    .card-header {

      padding:
        18px 20px;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        15px;

      border-bottom:
        1px solid #edf0f5;

    }


    .card-title {

      margin:
        0;

      color:
        #0a1383;

      font-size:
        20px;

    }


    .card-tools {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      flex-wrap:
        wrap;

    }


    .search-box {

      height:
        40px;

      min-width:
        280px;

      padding:
        0 12px;

      border:
        1px solid #d5dbea;

      border-radius:
        8px;

      outline:
        none;

    }


    .search-box:focus {

      border-color:
        #0a1383;

      box-shadow:
        0 0 0 3px
        rgba(10,19,131,.08);

    }



    /* =========================================
       BUTTON
    ========================================= */

    .primary-btn,
    .secondary-btn,
    .danger-btn,
    .edit-btn {

      border:
        none;

      border-radius:
        7px;

      padding:
        9px 14px;

      cursor:
        pointer;

      font-size:
        13px;

      font-weight:
        600;

    }


    .primary-btn {

      background:
        #0a1383;

      color:
        #ffffff;

    }


    .primary-btn:hover {

      background:
        #080f6d;

    }


    .secondary-btn {

      background:
        #eef0f5;

      color:
        #374151;

    }


    .secondary-btn:hover {

      background:
        #e1e5ed;

    }


    .danger-btn {

      background:
        #dc2626;

      color:
        #ffffff;

    }


    .edit-btn {

      background:
        #2563eb;

      color:
        #ffffff;

    }


    .edit-btn:hover {

      background:
        #1d4ed8;

    }



    /* =========================================
       TABLE
    ========================================= */

    .table-wrapper {

      width:
        100%;

      overflow-x:
        auto;

    }


    .data-table {

      width:
        100%;

      border-collapse:
        collapse;

      min-width:
        1050px;

    }


    .data-table th {

      background:
        #f8f9fc;

      color:
        #374151;

      font-size:
        13px;

      font-weight:
        700;

      text-align:
        center;

      white-space:
        nowrap;

      padding:
        13px 10px;

      border-bottom:
        1px solid #e5e7eb;

    }


    .data-table td {

      padding:
        12px 10px;

      border-bottom:
        1px solid #edf0f4;

      font-size:
        13px;

      vertical-align:
        middle;

      text-align:
        center;

      white-space:
        nowrap;

    }


    .data-table tbody tr:hover {

      background:
        #f8faff;

    }


    .student-name {

      text-align:
        left !important;

      min-width:
        190px;

    }


    .english-name {

      text-align:
        left !important;

      min-width:
        180px;

    }


    .action-cell {

      min-width:
        100px;

    }


    .status {

      display:
        inline-block;

      padding:
        4px 9px;

      border-radius:
        999px;

      font-size:
        11px;

      font-weight:
        700;

    }


    .status-active {

      background:
        #dcfce7;

      color:
        #166534;

    }


    .status-inactive {

      background:
        #fee2e2;

      color:
        #991b1b;

    }


    .status-suspended {

      background:
        #fef3c7;

      color:
        #92400e;

    }



    /* =========================================
       MODAL
    ========================================= */

    .modal {

      position:
        fixed;

      inset:
        0;

      background:
        rgba(15,23,42,.55);

      display:
        none;

      align-items:
        center;

      justify-content:
        center;

      padding:
        20px;

      z-index:
        9999;

    }


    .modal.show {

      display:
        flex;

    }


    .modal-content {

      width:
        min(850px, 100%);

      max-height:
        92vh;

      overflow-y:
        auto;

      background:
        #ffffff;

      border-radius:
        14px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

    }


    .modal-header {

      padding:
        18px 22px;

      border-bottom:
        1px solid #e5e7eb;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      position:
        sticky;

      top:
        0;

      background:
        #ffffff;

      z-index:
        2;

    }


    .modal-header h2 {

      margin:
        0;

      color:
        #0a1383;

      font-size:
        19px;

    }


    .close-btn {

      width:
        36px;

      height:
        36px;

      border:
        none;

      border-radius:
        50%;

      background:
        #f1f3f7;

      font-size:
        24px;

      cursor:
        pointer;

      color:
        #374151;

    }


    .modal-body {

      padding:
        22px;

    }


    .form-grid {

      display:
        grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap:
        16px;

    }


    .form-group {

      display:
        flex;

      flex-direction:
        column;

      gap:
        6px;

    }


    .form-group.full {

      grid-column:
        1 / -1;

    }


    .form-group label {

      font-size:
        13px;

      font-weight:
        700;

      color:
        #374151;

    }


    .form-group input,
    .form-group select {

      width:
        100%;

      height:
        42px;

      padding:
        0 11px;

      border:
        1px solid #d6dbe7;

      border-radius:
        7px;

      outline:
        none;

      background:
        #ffffff;

    }


    .form-group input:focus,
    .form-group select:focus {

      border-color:
        #0a1383;

      box-shadow:
        0 0 0 3px
        rgba(10,19,131,.07);

    }


    .readonly-input {

      background:
        #f3f4f6 !important;

      color:
        #6b7280;

    }


    .form-actions {

      margin-top:
        22px;

      display:
        flex;

      justify-content:
        flex-end;

      gap:
        10px;

    }



    /* =========================================
       EMPTY
    ========================================= */

    .empty-row {

      padding:
        30px !important;

      color:
        #9ca3af;

    }



    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      .admin-header {

        padding:
          15px;

        align-items:
          flex-start;

      }


      .admin-user {

        flex-direction:
          column;

        align-items:
          flex-end;

        gap:
          8px;

      }


      .card-header {

        align-items:
          stretch;

        flex-direction:
          column;

      }


      .card-tools {

        width:
          100%;

      }


      .search-box {

        width:
          100%;

        min-width:
          0;

      }


      .form-grid {

        grid-template-columns:
          1fr;

      }


      .form-group.full {

        grid-column:
          auto;

      }

    }

  </style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header class="admin-header">

  <div>

    <div class="admin-title">
      Admin Dashboard
    </div>

    <div class="admin-subtitle">
      ระบบจัดการนักศึกษาและ Staff
    </div>

  </div>


  <div class="admin-user">

    <div>

      <div id="adminName">
        Admin
      </div>

      <div
        id="adminRole"
        class="admin-role"
      >
        ADMIN
      </div>

    </div>


    <button
      type="button"
      id="logoutBtn"
      class="logout-btn"
    >
      ออกจากระบบ
    </button>

  </div>

</header>



<!-- ==================================================
     MAIN
================================================== -->

<main class="admin-container">


  <div
    id="messageBox"
    class="message-box"
  ></div>



  <!-- =================================================
       STUDENTS
  ================================================== -->

  <section class="admin-card">


    <div class="card-header">

      <h2 class="card-title">
        จัดการนักศึกษา
      </h2>


      <div class="card-tools">

        <input
          type="search"
          id="studentSearch"
          class="search-box"
          placeholder="ค้นหารหัส ชื่อ แผนก..."
        >


        <button
          type="button"
          id="addStudentBtn"
          class="primary-btn"
        >
          + เพิ่มนักศึกษา
        </button>

      </div>

    </div>



    <div class="table-wrapper">

      <table class="data-table">

        <thead>

          <tr>

            <th>
              รหัสนักศึกษา
            </th>

            <th>
              ชื่อ-นามสกุล
            </th>

            <th>
              English Name
            </th>

            <th>
              แผนก
            </th>

            <th>
              โทรศัพท์
            </th>

            <th>
              สถานะ
            </th>

            <th>
              วันออกบัตร
            </th>

            <th>
              วันหมดอายุ
            </th>

            <th>
              จัดการ
            </th>

          </tr>

        </thead>


        <tbody id="studentsTableBody">

          <tr>

            <td
              colspan="9"
              class="empty-row"
            >
              กำลังโหลด...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>



  <!-- =================================================
       STAFF
  ================================================== -->

  <section class="admin-card">


    <div class="card-header">

      <h2 class="card-title">
        จัดการ Staff
      </h2>


      <button
        type="button"
        id="addStaffBtn"
        class="primary-btn"
      >
        + เพิ่ม Staff
      </button>

    </div>



    <div class="table-wrapper">

      <table class="data-table">

        <thead>

          <tr>

            <th>
              Admin ID
            </th>

            <th>
              Username
            </th>

            <th>
              ชื่อ
            </th>

            <th>
              Role
            </th>

            <th>
              Status
            </th>

          </tr>

        </thead>


        <tbody id="staffTableBody">

          <tr>

            <td
              colspan="5"
              class="empty-row"
            >
              กำลังโหลด...

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>


</main>



<!-- ==================================================
     STUDENT MODAL
     เพิ่ม + แก้ไข
================================================== -->

<div
  id="studentModal"
  class="modal"
>

  <div class="modal-content">


    <div class="modal-header">

      <h2 id="studentModalTitle">
        เพิ่มนักศึกษา
      </h2>


      <button
        type="button"
        id="closeStudentModal"
        class="close-btn"
      >
        ×
      </button>

    </div>



    <div class="modal-body">


      <form
        id="studentForm"
      >


        <div class="form-grid">


          <!-- student_id -->

          <div class="form-group">

            <label>
              รหัสนักศึกษา *
            </label>

            <input
              type="text"
              id="studentId"
              required
            >

          </div>



          <!-- password -->

          <div
            class="form-group"
            id="studentPasswordGroup"
          >

            <label>
              รหัสผ่านเริ่มต้น
            </label>

            <input
              type="password"
              id="studentPassword"
              value="123456"
            >

          </div>



          <!-- prefix -->

          <div class="form-group">

            <label>
              คำนำหน้า
            </label>

            <select id="studentPrefix">

              <option value="">
                เลือก
              </option>

              <option value="นาย">
                นาย
              </option>

              <option value="นางสาว">
                นางสาว
              </option>

              <option value="นาง">
                นาง
              </option>

            </select>

          </div>



          <!-- firstname -->

          <div class="form-group">

            <label>
              ชื่อ *
            </label>

            <input
              type="text"
              id="studentFirstnameTh"
              required
            >

          </div>



          <!-- lastname -->

          <div class="form-group">

            <label>
              นามสกุล *
            </label>

            <input
              type="text"
              id="studentLastnameTh"
              required
            >

          </div>



          <!-- firstname en -->

          <div class="form-group">

            <label>
              ชื่อภาษาอังกฤษ
            </label>

            <input
              type="text"
              id="studentFirstnameEn"
            >

          </div>



          <!-- lastname en -->

          <div class="form-group">

            <label>
              นามสกุลภาษาอังกฤษ
            </label>

            <input
              type="text"
              id="studentLastnameEn"
            >

          </div>



          <!-- department -->

          <div class="form-group">

            <label>
              แผนก
            </label>

            <input
              type="text"
              id="studentDepartment"
            >

          </div>



          <!-- phone -->

          <div class="form-group">

            <label>
              เบอร์โทรศัพท์
            </label>

            <input
              type="tel"
              id="studentPhone"
            >

          </div>



          <!-- status -->

          <div class="form-group">

            <label>
              สถานะ
            </label>

            <select id="studentStatus">

              <option value="นักศึกษาปกติ">
                นักศึกษาปกติ
              </option>

              <option value="INACTIVE">
                INACTIVE
              </option>

              <option value="SUSPENDED">
                SUSPENDED
              </option>

            </select>

          </div>



          <!-- issue date -->

          <div class="form-group">

            <label>
              วันออกบัตร
            </label>

            <input
              type="date"
              id="studentIssueDate"
            >

          </div>



          <!-- expire date -->

          <div class="form-group">

            <label>
              วันหมดอายุ
            </label>

            <input
              type="date"
              id="studentExpireDate"
            >

          </div>



          <!-- photo -->

          <div class="form-group full">

            <label>
              Photo URL
            </label>

            <input
              type="text"
              id="studentPhoto"
              placeholder="assets/students/TEST001.png"
            >

          </div>


        </div>



        <div class="form-actions">

          <button
            type="button"
            class="secondary-btn"
            id="closeStudentModal2"
          >
            ยกเลิก
          </button>


          <button
            type="submit"
            class="primary-btn"
            id="saveStudentBtn"
          >
            บันทึกนักศึกษา
          </button>

        </div>


      </form>

    </div>

  </div>

</div>



<!-- ==================================================
     STAFF MODAL
================================================== -->

<div
  id="staffModal"
  class="modal"
>

  <div class="modal-content">


    <div class="modal-header">

      <h2>
        เพิ่ม Staff
      </h2>


      <button
        type="button"
        id="closeStaffModal"
        class="close-btn"
      >
        ×
      </button>

    </div>



    <div class="modal-body">


      <form
        id="staffForm"
      >


        <div class="form-grid">


          <div class="form-group">

            <label>
              Username *
            </label>

            <input
              type="text"
              id="staffUsername"
              required
            >

          </div>



          <div class="form-group">

            <label>
              Password *
            </label>

            <input
              type="password"
              id="staffPassword"
              required
            >

          </div>



          <div class="form-group full">

            <label>
              ชื่อ Staff *
            </label>

            <input
              type="text"
              id="staffName"
              required
            >

          </div>



          <div class="form-group">

            <label>
              Role
            </label>

            <select id="staffRole">

              <option value="STAFF">
                STAFF
              </option>

              <option value="ADMIN">
                ADMIN
              </option>

            </select>

          </div>



          <div class="form-group">

            <label>
              Status
            </label>

            <select id="staffStatus">

              <option value="ACTIVE">
                ACTIVE
              </option>

              <option value="INACTIVE">
                INACTIVE
              </option>

            </select>

          </div>


        </div>



        <div class="form-actions">

          <button
            type="button"
            class="secondary-btn"
            id="closeStaffModal2"
          >
            ยกเลิก
          </button>


          <button
            type="submit"
            class="primary-btn"
            id="saveStaffBtn"
          >
            บันทึก Staff
          </button>

        </div>


      </form>

    </div>

  </div>

</div>



<!-- ==================================================
     JAVASCRIPT
================================================== -->

<script src="js/config.js"></script>

<script src="js/admin-dashboard.js"></script>


</body>

</html>
