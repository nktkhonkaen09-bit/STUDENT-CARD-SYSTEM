<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin Dashboard
  </title>


  <link
    rel="stylesheet"
    href="Css/admin-dashboard.css"
  >

</head>


<body>


<!-- ==================================================
     HEADER
=================================================== -->

<header class="admin-header">

  <div>

    <div class="admin-title">
      Admin Dashboard
    </div>

    <div>
      ระบบจัดการนักศึกษา
    </div>

  </div>


  <div class="admin-user">

    <div>

      <div id="adminName">
        Admin
      </div>

      <div
        id="adminRole"
        class="admin-role"
      >
        ADMIN
      </div>

    </div>


    <button
      type="button"
      id="logoutBtn"
      class="logout-btn"
    >
      ออกจากระบบ
    </button>

  </div>

</header>



<!-- ==================================================
     MAIN
=================================================== -->

<main class="admin-container">


  <div
    id="messageBox"
    class="message-box"
  ></div>



  <!-- =================================================
       STUDENTS
  ================================================== -->

  <section class="admin-card">


    <div class="card-header">

      <h2 class="card-title">
        จัดการนักศึกษา
      </h2>


      <div>

        <input
          type="search"
          id="studentSearch"
          class="search-box"
          placeholder="ค้นหารหัส ชื่อ แผนก..."
        >


        <button
          type="button"
          id="addStudentBtn"
          class="primary-btn"
        >
          + เพิ่มนักศึกษา
        </button>

      </div>

    </div>



    <div class="table-wrapper">

      <table class="data-table">

        <thead>

          <tr>

            <th>
              รหัสนักศึกษา
            </th>

            <th>
              ชื่อ-นามสกุล
            </th>

            <th>
              English Name
            </th>

            <th>
              แผนก
            </th>

            <th>
              โทรศัพท์
            </th>

            <th>
              สถานะ
            </th>

            <th>
              วันออกบัตร
            </th>

            <th>
              วันหมดอายุ
            </th>

          </tr>

        </thead>


        <tbody id="studentsTableBody">

          <tr>

            <td colspan="8">
              กำลังโหลด...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>



  <!-- =================================================
       STAFF
  ================================================== -->

  <section class="admin-card">


    <div class="card-header">

      <h2 class="card-title">
        จัดการ Staff
      </h2>


      <button
        type="button"
        id="addStaffBtn"
        class="primary-btn"
      >
        + เพิ่ม Staff
      </button>

    </div>



    <div class="table-wrapper">

      <table class="data-table">

        <thead>

          <tr>

            <th>
              Admin ID
            </th>

            <th>
              Username
            </th>

            <th>
              ชื่อ
            </th>

            <th>
              Role
            </th>

            <th>
              Status
            </th>

          </tr>

        </thead>


        <tbody id="staffTableBody">

          <tr>

            <td colspan="5">
              กำลังโหลด...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>


</main>



<!-- ==================================================
     STUDENT MODAL
=================================================== -->

<div
  id="studentModal"
  class="modal"
>

  <div class="modal-content">


    <div class="modal-header">

      <h2>
        เพิ่มนักศึกษา
      </h2>


      <button
        type="button"
        id="closeStudentModal"
        class="close-btn"
      >
        ×
      </button>

    </div>



    <form
      id="studentForm"
    >


      <div class="form-grid">


        <div class="form-group">

          <label>
            รหัสนักศึกษา *
          </label>

          <input
            type="text"
            id="studentId"
            required
          >

        </div>



        <div class="form-group">

          <label>
            รหัสผ่านเริ่มต้น *
          </label>

          <input
            type="password"
            id="studentPassword"
            value="123456"
            required
          >

        </div>



        <div class="form-group">

          <label>
            คำนำหน้า
          </label>

          <select id="studentPrefix">

            <option value="">
              เลือก
            </option>

            <option value="นาย">
              นาย
            </option>

            <option value="นางสาว">
              นางสาว
            </option>

            <option value="นาง">
              นาง
            </option>

          </select>

        </div>



        <div class="form-group">

          <label>
            ชื่อ *
          </label>

          <input
            type="text"
            id="studentFirstnameTh"
            required
          >

        </div>



        <div class="form-group">

          <label>
            นามสกุล *
          </label>

          <input
            type="text"
            id="studentLastnameTh"
            required
          >

        </div>



        <div class="form-group">

          <label>
            ชื่อภาษาอังกฤษ
          </label>

          <input
            type="text"
            id="studentFirstnameEn"
          >

        </div>



        <div class="form-group">

          <label>
            นามสกุลภาษาอังกฤษ
          </label>

          <input
            type="text"
            id="studentLastnameEn"
          >

        </div>



        <div class="form-group">

          <label>
            แผนก
          </label>

          <input
            type="text"
            id="studentDepartment"
          >

        </div>



        <div class="form-group">

          <label>
            เบอร์โทรศัพท์
          </label>

          <input
            type="tel"
            id="studentPhone"
          >

        </div>



        <div class="form-group">

          <label>
            สถานะ
          </label>

          <select id="studentStatus">

            <option value="นักศึกษาปกติ">
              นักศึกษาปกติ
            </option>

            <option value="INACTIVE">
              INACTIVE
            </option>

            <option value="SUSPENDED">
              SUSPENDED
            </option>

          </select>

        </div>



        <div class="form-group">

          <label>
            วันออกบัตร
          </label>

          <input
            type="date"
            id="studentIssueDate"
          >

        </div>



        <div class="form-group">

          <label>
            วันหมดอายุ
          </label>

          <input
            type="date"
            id="studentExpireDate"
          >

        </div>



        <div class="form-group full">

          <label>
            Photo URL
          </label>

          <input
            type="text"
            id="studentPhoto"
            placeholder="เช่น assets/students/TEST001.png"
          >

        </div>


      </div>



      <div class="form-actions">

        <button
          type="button"
          class="secondary-btn"
          id="closeStudentModal2"
        >
          ยกเลิก
        </button>


        <button
          type="submit"
          class="primary-btn"
          id="saveStudentBtn"
        >
          บันทึกนักศึกษา
        </button>

      </div>


    </form>

  </div>

</div>



<!-- ==================================================
     STAFF MODAL
=================================================== -->

<div
  id="staffModal"
  class="modal"
>

  <div class="modal-content">


    <div class="modal-header">

      <h2>
        เพิ่ม Staff
      </h2>


      <button
        type="button"
        id="closeStaffModal"
        class="close-btn"
      >
        ×
      </button>

    </div>



    <form
      id="staffForm"
    >


      <div class="form-grid">


        <div class="form-group">

          <label>
            Username *
          </label>

          <input
            type="text"
            id="staffUsername"
            required
          >

        </div>



        <div class="form-group">

          <label>
            Password *
          </label>

          <input
            type="password"
            id="staffPassword"
            required
          >

        </div>



        <div class="form-group full">

          <label>
            ชื่อ Staff *
          </label>

          <input
            type="text"
            id="staffName"
            required
          >

        </div>



        <div class="form-group">

          <label>
            Role
          </label>

          <select id="staffRole">

            <option value="STAFF">
              STAFF
            </option>

            <option value="ADMIN">
              ADMIN
            </option>

          </select>

        </div>



        <div class="form-group">

          <label>
            Status
          </label>

          <select id="staffStatus">

            <option value="ACTIVE">
              ACTIVE
            </option>

            <option value="INACTIVE">
              INACTIVE
            </option>

          </select>

        </div>


      </div>



      <div class="form-actions">

        <button
          type="button"
          class="secondary-btn"
          id="closeStaffModal2"
        >
          ยกเลิก
        </button>


        <button
          type="submit"
          class="primary-btn"
          id="saveStaffBtn"
        >
          บันทึก Staff
        </button>

      </div>


    </form>

  </div>

</div>



<!-- ==================================================
     JAVASCRIPT
=================================================== -->

<script src="js/config.js"></script>

<script src="js/admin-dashboard.js"></script>


<script>

document
  .getElementById(
    "closeStudentModal2"
  )
  .addEventListener(
    "click",
    function () {

      document
        .getElementById(
          "studentModal"
        )
        .classList
        .remove("show");

    }
  );


document
  .getElementById(
    "closeStaffModal2"
  )
  .addEventListener(
    "click",
    function () {

      document
        .getElementById(
          "staffModal"
        )
        .classList
        .remove("show");

    }
  );

</script>


</body>

</html>
