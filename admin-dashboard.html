<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0a1383"
>

<title>
    Admin Dashboard | Student Card System
</title>


<style>

/* =========================================
   RESET
   ========================================= */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #ffffff 80%,
            #eef0ff 100%
        );

    color:
        #111827;

}


/* =========================================
   HEADER
   ========================================= */

.header {

    background:
        #0a1383;

    color:
        #ffffff;

    padding:
        18px 25px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        15px;

}


.header-title {

    font-size:
        22px;

    font-weight:
        700;

}


.header-subtitle {

    margin-top:
        4px;

    font-size:
        12px;

    opacity:
        .8;

}


.admin-info {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

}


.admin-name {

    font-size:
        14px;

}


.logout-button {

    border:
        1px solid
        rgba(255,255,255,.5);

    background:
        transparent;

    color:
        #ffffff;

    border-radius:
        8px;

    padding:
        9px 14px;

    cursor:
        pointer;

}


.logout-button:hover {

    background:
        rgba(255,255,255,.12);

}


/* =========================================
   MAIN
   ========================================= */

.main {

    max-width:
        1400px;

    margin:
        0 auto;

    padding:
        25px;

}


/* =========================================
   TOP BAR
   ========================================= */

.top-bar {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        15px;

    margin-bottom:
        18px;

}


.page-title {

    font-size:
        20px;

    font-weight:
        700;

    color:
        #0a1383;

}


/* =========================================
   SEARCH
   ========================================= */

.search-box {

    display:
        flex;

    gap:
        8px;

    width:
        min(100%, 420px);

}


.search-box input {

    flex:
        1;

    height:
        44px;

    border:
        1px solid #d9ddea;

    border-radius:
        8px;

    padding:
        0 13px;

    outline:
        none;

    font-size:
        14px;

}


.search-box input:focus {

    border-color:
        #0a1383;

    box-shadow:
        0 0 0 3px
        rgba(10,19,131,.08);

}


.search-button {

    border:
        none;

    background:
        #0a1383;

    color:
        #ffffff;

    border-radius:
        8px;

    padding:
        0 18px;

    cursor:
        pointer;

    font-weight:
        600;

}


.search-button:hover {

    background:
        #080f6d;

}


/* =========================================
   MESSAGE
   ========================================= */

.message {

    min-height:
        24px;

    margin-bottom:
        12px;

    padding:
        10px 14px;

    border-radius:
        8px;

    font-size:
        13px;

    display:
        none;

}


.message.show {

    display:
        block;

}


.message.success {

    background:
        #ecfdf3;

    color:
        #15803d;

}


.message.error {

    background:
        #fef2f2;

    color:
        #dc2626;

}


.message.info {

    background:
        #eef0ff;

    color:
        #0a1383;

}


/* =========================================
   TABLE CARD
   ========================================= */

.table-card {

    background:
        #ffffff;

    border:
        1px solid #e1e4ef;

    border-radius:
        14px;

    overflow:
        hidden;

    box-shadow:
        0 8px 25px
        rgba(10,19,131,.07);

}


.table-scroll {

    width:
        100%;

    overflow-x:
        auto;

}


table {

    width:
        100%;

    min-width:
        1050px;

    border-collapse:
        collapse;

}


thead {

    background:
        #0a1383;

    color:
        #ffffff;

}


th {

    padding:
        13px 10px;

    text-align:
        left;

    font-size:
        13px;

    font-weight:
        600;

    white-space:
        nowrap;

}


td {

    padding:
        11px 10px;

    border-bottom:
        1px solid #edf0f5;

    font-size:
        13px;

    vertical-align:
        middle;

}


tbody tr:hover {

    background:
        #f8f9ff;

}


/* =========================================
   PHOTO
   ========================================= */

.student-photo {

    width:
        45px;

    height:
        55px;

    object-fit:
        cover;

    border-radius:
        6px;

    border:
        1px solid #d9ddea;

    background:
        #f3f4f6;

}


.no-photo {

    width:
        45px;

    height:
        55px;

    border-radius:
        6px;

    background:
        #eef0ff;

    color:
        #0a1383;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        20px;

}


/* =========================================
   STATUS
   ========================================= */

.status {

    display:
        inline-block;

    padding:
        5px 9px;

    border-radius:
        20px;

    font-size:
        11px;

    white-space:
        nowrap;

}


.status.normal {

    background:
        #ecfdf3;

    color:
        #15803d;

}


.status.other {

    background:
        #f3f4f6;

    color:
        #4b5563;

}


/* =========================================
   ACTIONS
   ========================================= */

.actions {

    display:
        flex;

    gap:
        6px;

    flex-wrap:
        wrap;

}


.action-button {

    border:
        none;

    border-radius:
        7px;

    padding:
        7px 10px;

    font-size:
        11px;

    cursor:
        pointer;

    white-space:
        nowrap;

}


.edit-button {

    background:
        #eef0ff;

    color:
        #0a1383;

}


.edit-button:hover {

    background:
        #dfe3ff;

}


.reset-button {

    background:
        #fff7ed;

    color:
        #c2410c;

}


.reset-button:hover {

    background:
        #ffedd5;

}


/* =========================================
   EMPTY
   ========================================= */

.empty {

    text-align:
        center;

    padding:
        50px 20px;

    color:
        #9ca3af;

}


/* =========================================
   MODAL
   ========================================= */

.modal {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(17,24,39,.45);

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    z-index:
        1000;

}


.modal.show {

    display:
        flex;

}


.modal-card {

    width:
        100%;

    max-width:
        520px;

    max-height:
        90vh;

    overflow-y:
        auto;

    background:
        #ffffff;

    border-radius:
        15px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.2);

}


.modal-header {

    padding:
        18px 20px;

    background:
        #0a1383;

    color:
        #ffffff;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

}


.modal-title {

    font-size:
        17px;

    font-weight:
        700;

}


.close-button {

    border:
        none;

    background:
        transparent;

    color:
        #ffffff;

    font-size:
        25px;

    cursor:
        pointer;

}


.modal-body {

    padding:
        20px;

}


/* =========================================
   FORM
   ========================================= */

.form-grid {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        14px;

}


.form-group {

    display:
        flex;

    flex-direction:
        column;

}


.form-group.full {

    grid-column:
        1 / -1;

}


.form-group label {

    margin-bottom:
        6px;

    font-size:
        12px;

    font-weight:
        600;

    color:
        #374151;

}


.form-group input {

    height:
        42px;

    border:
        1px solid #d9ddea;

    border-radius:
        7px;

    padding:
        0 11px;

    outline:
        none;

}


.form-group input:focus {

    border-color:
        #0a1383;

}


.modal-footer {

    padding:
        15px 20px;

    border-top:
        1px solid #edf0f5;

    display:
        flex;

    justify-content:
        flex-end;

    gap:
        8px;

}


.cancel-button {

    border:
        1px solid #d1d5db;

    background:
        #ffffff;

    color:
        #374151;

    border-radius:
        8px;

    padding:
        9px 16px;

    cursor:
        pointer;

}


.save-button {

    border:
        none;

    background:
        #0a1383;

    color:
        #ffffff;

    border-radius:
        8px;

    padding:
        9px 18px;

    cursor:
        pointer;

    font-weight:
        600;

}


.save-button:disabled {

    opacity:
        .6;

    cursor:
        not-allowed;

}


/* =========================================
   RESET PASSWORD
   ========================================= */

.reset-info {

    background:
        #fff7ed;

    color:
        #9a3412;

    padding:
        12px;

    border-radius:
        8px;

    font-size:
        13px;

    line-height:
        1.6;

    margin-bottom:
        16px;

}


.student-name-box {

    background:
        #f8f9ff;

    border:
        1px solid #e1e4ef;

    padding:
        12px;

    border-radius:
        8px;

    margin-bottom:
        16px;

}


.student-name-box strong {

    color:
        #0a1383;

}


/* =========================================
   MOBILE
   ========================================= */

@media (
    max-width: 700px
) {

    .header {

        padding:
            15px;

        align-items:
            flex-start;

        flex-direction:
            column;

    }


    .admin-info {

        width:
            100%;

        justify-content:
            space-between;

    }


    .main {

        padding:
            15px;

    }


    .top-bar {

        align-items:
            stretch;

        flex-direction:
            column;

    }


    .search-box {

        width:
            100%;

    }


    .form-grid {

        grid-template-columns:
            1fr;

    }


    .form-group.full {

        grid-column:
            auto;

    }

}

</style>

</head>


<body>

     HEADER
     ========================================= -->

<header class="header">

<!-- =========================================

<div

    <div class="modal-card">

<!-- =========================================

     ========================================= -->

<div

    class="modal"
>

<script>

/* =========================================
   CONFIG
   ========================================= */

const CONFIG = {

    API_URL:
        "https://script.google.com/macros/s/AKfycbxCvk2wb6FydCKNkEDvApbTgZWmSFoAzPvvM2sSDOIwSgvftMoQxIX3cy7npP3_6xT4/exec",

    ADMIN_SESSION_KEY:
        "admin_session",

    ADMIN_KEY:
        "admin_data"

};


/* =========================================
   GLOBAL
   ========================================= */

let students = [];

let selectedStudent = null;


/* =========================================
   PAGE READY
   ========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        checkAdminSession();

        loadAdminInfo();

        loadStudents();


        document
            .getElementById(
                "searchButton"
            )
            .addEventListener(
                "click",
                loadStudents
            );


        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        loadStudents();

                    }

                }
            );


        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                adminLogout
            );

    }
);


/* =========================================
   CHECK ADMIN SESSION
   ========================================= */

function checkAdminSession() {

    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    if (!token) {

        window.location.href =
            "admin-login.html";

    }

}


/* =========================================
   LOAD ADMIN INFO
   ========================================= */

function loadAdminInfo() {

    const raw =
        sessionStorage.getItem(
            CONFIG.ADMIN_KEY
        );


    if (!raw) {

        return;

    }


    try {

        const admin =
            JSON.parse(
                raw
            );


        document
            .getElementById(
                "adminName"
            )
            .textContent =
            admin.username ||
            "Admin";


    } catch (error) {

        console.error(error);

    }

}


/* =========================================
   API REQUEST
   ========================================= */

async function apiRequest(data) {

    const response =
        await fetch(

            CONFIG.API_URL,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        data
                    )

            }

        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    return await response.json();

}


/* =========================================
   LOAD STUDENTS
   ========================================= */

async function loadStudents() {

    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();


    showPageMessage(
        "กำลังโหลดข้อมูล...",
        "info"
    );


    try {

        const result =
            await apiRequest({

                action:
                    "adminGetStudents",

                token:
                    token,

                search:
                    search

            });


        if (
            !result.success
        ) {

            if (
                result.code ===
                "ADMIN_SESSION_EXPIRED"
            ) {

                forceAdminLogout();

                return;

            }


            showPageMessage(
                result.message ||
                "ไม่สามารถโหลดข้อมูลได้",
                "error"
            );

            return;

        }


        students =
            result.students || [];


        renderStudents(
            students
        );


        hidePageMessage();


    } catch (error) {

        console.error(error);


        showPageMessage(
            "ไม่สามารถเชื่อมต่อระบบได้",
            "error"
        );

    }

}


/* =========================================
   RENDER STUDENTS
   ========================================= */

function renderStudents(list) {

    const tbody =
        document.getElementById(
            "studentTableBody"
        );


    tbody.innerHTML =
        "";


    if (
        !list ||
        list.length === 0
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    ไม่พบข้อมูลนักศึกษา

                </td>

            </tr>

        `;

        return;

    }


    list.forEach(
        function(student) {

            const tr =
                document.createElement(
                    "tr"
                );


            const fullName =
                [

                    student.prefix_th || "",

                    student.firstname_th || "",

                    student.lastname_th || ""

                ]

                .join(" ")

                .replace(
                    /\s+/g,
                    " "
                )

                .trim();


            const englishName =
                [

                    student.firstname_en || "",

                    student.lastname_en || ""

                ]

                .join(" ")

                .trim();


            const statusClass =
                String(
                    student.status || ""
                )
                .includes(
                    "ปกติ"
                )
                    ? "normal"
                    : "other";


            let photoHtml =
                "";


            if (
                student.photo_url
            ) {

                photoHtml = `

                    <img
                        class="student-photo"
                        src="${escapeHtml(student.photo_url)}"
                        alt="รูปนักศึกษา"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                    >

                    <div
                        class="no-photo"
                        style="display:none"
                    >
                        👤
                    </div>

                `;

            } else {

                photoHtml = `

                    <div
                        class="no-photo"
                    >
                        👤
                    </div>

                `;

            }


            tr.innerHTML = `

                <td>
                    ${photoHtml}
                </td>

                <td>
                    <strong>
                        ${escapeHtml(student.student_id || "-")}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(fullName || "-")}
                </td>

                <td>
                    ${escapeHtml(englishName || "-")}
                </td>

                <td>
                    ${escapeHtml(student.department || "-")}
                </td>

                <td>

                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHtml(student.status || "-")}
                    </span>

                </td>

                <td>
                    ${escapeHtml(student.phone || "-")}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="action-button edit-button"
                            onclick="openEditModal('${escapeJs(student.student_id)}')"
                        >
                            ✏️ แก้ไข
                        </button>

                        <button
                            class="action-button reset-button"
                            onclick="openResetModal('${escapeJs(student.student_id)}')"
                        >
                            🔑 รีเซ็ต
                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}

/* =========================================
   SAVE STUDENT
   ========================================= */

async function saveStudent() {

    if (!selectedStudent) {

        return;

    }


    const button =
        document.getElementById(
            "saveEditButton"
        );


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    const data = {

        action:
            "adminUpdateStudent",

        token:
            token,

        student_id:
            document
                .getElementById(
                    "editStudentId"
                )
                .value,

        prefix_th:
            document
                .getElementById(
                    "editPrefix"
                )
                .value,

        firstname_th:
            document
                .getElementById(
                    "editFirstname"
                )
                .value,

        lastname_th:
            document
                .getElementById(
                    "editLastname"
                )
                .value,

        firstname_en:
            document
                .getElementById(
                    "editFirstnameEn"
                )
                .value,

        lastname_en:
            document
                .getElementById(
                    "editLastnameEn"
                )
                .value,

        department:
            document
                .getElementById(
                    "editDepartment"
                )
                .value,

        status:
            document
                .getElementById(
                    "editStatus"
                )
                .value,

        phone:
            document
                .getElementById(
                    "editPhone"
                )
                .value,

        photo_url:
            document
                .getElementById(
                    "editPhotoUrl"
                )
                .value,

        issue_date:
            document
                .getElementById(
                    "editIssueDate"
                )
                .value,

        expire_date:
            document
                .getElementById(
                    "editExpireDate"
                )
                .value

    };


    button.disabled =
        true;


    button.textContent =
        "กำลังบันทึก...";


    try {

        const result =
            await apiRequest(
                data
            );


        if (!result.success) {

            if (
                result.code ===
                "ADMIN_SESSION_EXPIRED"
            ) {

                forceAdminLogout();

                return;

            }


            showPageMessage(
                result.message ||
                "บันทึกข้อมูลไม่สำเร็จ",
                "error"
            );

            return;

        }


        closeEditModal();


        showPageMessage(
            "บันทึกข้อมูลนักศึกษาสำเร็จ",
            "success"
        );


        await loadStudents();


    } catch (error) {

        console.error(error);


        showPageMessage(
            "ไม่สามารถเชื่อมต่อระบบได้",
            "error"
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            "บันทึกข้อมูล";

    }

}

/* =========================================
   RESET PASSWORD
   ========================================= */

async function resetPassword() {

    if (!selectedStudent) {

        return;

    }


    const password =
        document
            .getElementById(
                "newPassword"
            )
            .value;


    const message =
        document.getElementById(
            "resetMessage"
        );


    if (!password) {

        showResetMessage(
            "กรุณากรอกรหัสผ่านใหม่",
            "error"
        );

        return;

    }


    if (
        password.length < 6
    ) {

        showResetMessage(
            "รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "resetButton"
        );


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    button.disabled =
        true;


    button.textContent =
        "กำลังรีเซ็ต...";


    try {

        const result =
            await apiRequest({

                action:
                    "adminResetPassword",

                token:
                    token,

                student_id:
                    selectedStudent.student_id,

                newPassword:
                    password

            });


        if (!result.success) {

            if (
                result.code ===
                "ADMIN_SESSION_EXPIRED"
            ) {

                forceAdminLogout();

                return;

            }


            showResetMessage(
                result.message ||
                "รีเซ็ตรหัสผ่านไม่สำเร็จ",
                "error"
            );

            return;

        }


        showResetMessage(
            "รีเซ็ตรหัสผ่านสำเร็จ",
            "success"
        );


        showPageMessage(
            "รีเซ็ตรหัสผ่าน " +
            selectedStudent.student_id +
            " สำเร็จ",
            "success"
        );


        document
            .getElementById(
                "newPassword"
            )
            .value =
            "";


        setTimeout(
            function () {

                closeResetModal();

            },
            1000
        );


    } catch (error) {

        console.error(error);


        showResetMessage(
            "ไม่สามารถเชื่อมต่อระบบได้",
            "error"
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            "รีเซ็ตรหัสผ่าน";

    }

}

/* =========================================

   ========================================= */

async function adminLogout() {

    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    try {

        if (token) {

            await apiRequest({

                action:
                    "adminLogout",

                token:
                    token

            });

        }

    } catch (error) {

        console.error(error);

    }


    forceAdminLogout();

}


/* =========================================
   FORCE LOGOUT
   ========================================= */

function forceAdminLogout() {

    sessionStorage.removeItem(
        CONFIG.ADMIN_SESSION_KEY
    );


    sessionStorage.removeItem(
        CONFIG.ADMIN_KEY
    );


    window.location.href =
        "admin-login.html";

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(value) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================
   ESCAPE JS
   ========================================= */

function escapeJs(value) {

    return String(
        value || ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /"/g,
        '\\"'
    )

    .replace(
        /\n/g,
        "\\n"
    )

    .replace(
        /\r/g,
        "\\r"
    );

}


/* =========================================
   CLOSE MODALS WHEN CLICK OUTSIDE
   ========================================= */

document.addEventListener(
    "click",
    function(event) {

        const editModal =
            document.getElementById(
                "editModal"
            );


        const resetModal =
            document.getElementById(
                "resetModal"
            );


        if (
            event.target ===
            editModal
        ) {

            closeEditModal();

        }


        if (
            event.target ===
            resetModal
        ) {

            closeResetModal();

        }

    }
);


/* =========================================
   ESC KEY
   ========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            closeEditModal();

            closeResetModal();

        }

    }
);
