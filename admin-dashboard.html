<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0a1383"
>

<title>
Admin Dashboard | Student Card System
</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #ffffff 80%,
      #eef0ff 100%
    );

  color:
    #111827;

}


/* =========================================
   HEADER
   ========================================= */

.header {

  background:
    #0a1383;

  color:
    #ffffff;

  padding:
    18px 25px;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    15px;

  flex-wrap:
    wrap;

}


.header-title {

  font-size:
    21px;

  font-weight:
    bold;

}


.header-subtitle {

  font-size:
    11px;

  opacity:
    .8;

  margin-top:
    3px;

}


.logout-button {

  border:
    1px solid
    rgba(255,255,255,.5);

  background:
    transparent;

  color:
    #ffffff;

  padding:
    9px 16px;

  border-radius:
    8px;

  cursor:
    pointer;

}


.logout-button:hover {

  background:
    rgba(255,255,255,.12);

}


/* =========================================
   CONTAINER
   ========================================= */

.container {

  width:
    100%;

  max-width:
    1400px;

  margin:
    0 auto;

  padding:
    25px;

}


/* =========================================
   TOP BAR
   ========================================= */

.top-bar {

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    15px;

  margin-bottom:
    20px;

  flex-wrap:
    wrap;

}


.page-title {

  color:
    #0a1383;

  font-size:
    23px;

  font-weight:
    bold;

}


.admin-name {

  color:
    #6b7280;

  font-size:
    13px;

}


/* =========================================
   SEARCH
   ========================================= */

.search-box {

  background:
    #ffffff;

  border:
    1px solid #e1e4ef;

  border-radius:
    12px;

  padding:
    16px;

  margin-bottom:
    20px;

  box-shadow:
    0 5px 20px
    rgba(10,19,131,.06);

}


.search-row {

  display:
    flex;

  gap:
    10px;

}


.search-input {

  flex:
    1;

  height:
    45px;

  border:
    1px solid #d8dce9;

  border-radius:
    8px;

  padding:
    0 13px;

  outline:
    none;

  font-size:
    14px;

}


.search-input:focus {

  border-color:
    #0a1383;

}


.search-button {

  height:
    45px;

  padding:
    0 20px;

  border:
    none;

  border-radius:
    8px;

  background:
    #0a1383;

  color:
    #ffffff;

  cursor:
    pointer;

}


.search-button:hover {

  background:
    #080f6d;

}


/* =========================================
   MESSAGE
   ========================================= */

.message {

  min-height:
    22px;

  margin:
    10px 0;

  font-size:
    13px;

  font-weight:
    600;

}


.message.success {

  color:
    #15803d;

}


.message.error {

  color:
    #dc2626;

}


.message.info {

  color:
    #0a1383;

}


/* =========================================
   TABLE
   ========================================= */

.table-card {

  background:
    #ffffff;

  border:
    1px solid #e1e4ef;

  border-radius:
    14px;

  overflow:
    hidden;

  box-shadow:
    0 8px 25px
    rgba(10,19,131,.07);

}


.table-wrapper {

  width:
    100%;

  overflow-x:
    auto;

}


table {

  width:
    100%;

  min-width:
    1000px;

  border-collapse:
    collapse;

}


thead {

  background:
    #0a1383;

  color:
    #ffffff;

}


th {

  padding:
    13px 10px;

  font-size:
    13px;

  white-space:
    nowrap;

}


td {

  padding:
    11px 10px;

  border-bottom:
    1px solid #edf0f6;

  font-size:
    13px;

  vertical-align:
    middle;

}


tbody tr:hover {

  background:
    #f7f8ff;

}


/* =========================================
   ACTION BUTTONS
   ========================================= */

.action-button {

  border:
    none;

  border-radius:
    7px;

  padding:
    7px 11px;

  cursor:
    pointer;

  font-size:
    12px;

  margin:
    2px;

}


.edit-button {

  background:
    #eef0ff;

  color:
    #0a1383;

}


.edit-button:hover {

  background:
    #dfe3ff;

}


.reset-button {

  background:
    #fff1f2;

  color:
    #be123c;

}


.reset-button:hover {

  background:
    #ffe4e6;

}


/* =========================================
   MODAL
   ========================================= */

.modal {

  position:
    fixed;

  inset:
    0;

  background:
    rgba(0,0,0,.45);

  display:
    none;

  align-items:
    center;

  justify-content:
    center;

  padding:
    20px;

  z-index:
    1000;

}


.modal.show {

  display:
    flex;

}


.modal-card {

  width:
    100%;

  max-width:
    480px;

  background:
    #ffffff;

  border-radius:
    16px;

  padding:
    25px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.2);

}


.modal-title {

  margin:
    0 0 8px;

  color:
    #0a1383;

  font-size:
    20px;

}


.modal-subtitle {

  margin:
    0 0 20px;

  color:
    #6b7280;

  font-size:
    13px;

}


.student-info {

  background:
    #f5f6ff;

  border-radius:
    9px;

  padding:
    12px;

  margin-bottom:
    18px;

  font-size:
    13px;

}


.form-group {

  margin-bottom:
    15px;

}


.form-group label {

  display:
    block;

  margin-bottom:
    6px;

  font-size:
    13px;

  font-weight:
    bold;

}


.form-group input {

  width:
    100%;

  height:
    45px;

  padding:
    0 12px;

  border:
    1px solid #d8dce9;

  border-radius:
    8px;

  outline:
    none;

  font-size:
    14px;

}


.form-group input:focus {

  border-color:
    #0a1383;

  box-shadow:
    0 0 0 3px
    rgba(10,19,131,.08);

}


.modal-actions {

  display:
    flex;

  justify-content:
    flex-end;

  gap:
    9px;

  margin-top:
    20px;

}


.cancel-button {

  border:
    1px solid #d8dce9;

  background:
    #ffffff;

  color:
    #374151;

  padding:
    10px 17px;

  border-radius:
    8px;

  cursor:
    pointer;

}


.confirm-button {

  border:
    none;

  background:
    #0a1383;

  color:
    #ffffff;

  padding:
    10px 17px;

  border-radius:
    8px;

  cursor:
    pointer;

}


.confirm-button:disabled {

  opacity:
    .6;

  cursor:
    not-allowed;

}


/* =========================================
   EMPTY
   ========================================= */

.empty {

  text-align:
    center;

  padding:
    40px;

  color:
    #6b7280;

}


/* =========================================
   MOBILE
   ========================================= */

@media (
  max-width: 600px
) {

  .container {

    padding:
      15px;

  }


  .header {

    padding:
      15px;

  }


  .search-row {

    flex-direction:
      column;

  }


  .search-button {

    width:
      100%;

  }


  .modal-card {

    padding:
      20px;

  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
     ========================================= -->

<header class="header">

  <div>

    <div class="header-title">

      Student Card System

    </div>

    <div class="header-subtitle">

      ADMINISTRATOR DASHBOARD

    </div>

  </div>


  <button
    id="logoutButton"
    class="logout-button"
    type="button"
  >

    ออกจากระบบ

  </button>

</header>



<!-- =========================================
     MAIN
     ========================================= -->

<main class="container">


  <div class="top-bar">

    <div>

      <div class="page-title">

        จัดการข้อมูลนักศึกษา

      </div>

      <div
        id="adminName"
        class="admin-name"
      ></div>

    </div>

  </div>



  <!-- SEARCH -->

  <div class="search-box">

    <div class="search-row">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="ค้นหารหัสนักศึกษา ชื่อ นามสกุล สาขา หรือเบอร์โทร"
      >


      <button
        id="searchButton"
        class="search-button"
        type="button"
      >

        ค้นหา

      </button>

    </div>


    <div
      id="pageMessage"
      class="message"
    ></div>

  </div>



  <!-- TABLE -->

  <div class="table-card">

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>
              รหัสนักศึกษา
            </th>

            <th>
              ชื่อ-นามสกุล
            </th>

            <th>
              สาขา
            </th>

            <th>
              สถานะ
            </th>

            <th>
              เบอร์โทร
            </th>

            <th>
              จัดการ
            </th>

          </tr>

        </thead>


        <tbody
          id="studentTableBody"
        ></tbody>

      </table>

    </div>

  </div>

</main>



<!-- =========================================
     RESET PASSWORD MODAL
     ========================================= -->

<div
  id="resetModal"
  class="modal"
>


  <div class="modal-card">


    <h2 class="modal-title">

      รีเซ็ตรหัสผ่าน

    </h2>


    <p class="modal-subtitle">

      กำหนดรหัสผ่านใหม่ให้นักศึกษา

    </p>


    <div
      id="resetStudentInfo"
      class="student-info"
    ></div>


    <div class="form-group">

      <label
        for="newPassword"
      >

        รหัสผ่านใหม่

      </label>


      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="อย่างน้อย 6 ตัวอักษร"
      >

    </div>


    <div class="form-group">

      <label
        for="confirmPassword"
      >

        ยืนยันรหัสผ่านใหม่

      </label>


      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="กรอกรหัสผ่านอีกครั้ง"
      >

    </div>


    <div
      id="resetMessage"
      class="message"
    ></div>


    <div class="modal-actions">

      <button
        id="cancelResetButton"
        class="cancel-button"
        type="button"
      >

        ยกเลิก

      </button>


      <button
        id="confirmResetButton"
        class="confirm-button"
        type="button"
      >

        รีเซ็ตรหัสผ่าน

      </button>

    </div>


  </div>

</div>



<script>

/* ==============================================
   CONFIG
   ============================================== */

const CONFIG = {

  API_URL:
    "https://script.google.com/macros/s/AKfycbxCvk2wb6FydCKNkEDvApbTgZWmSFoAzPvvM2sSDOIwSgvftMoQxIX3cy7npP3_6xT4/exec",

  ADMIN_SESSION_KEY:
    "admin_session",

  ADMIN_KEY:
    "admin_data"

};


/* ==============================================
   STATE
   ============================================== */

let students = [];

let selectedStudent = null;


/* ==============================================
   PAGE READY
   ============================================== */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    initializePage();

  }
);


/* ==============================================
   INITIALIZE
   ============================================== */

function initializePage() {

  const token =
    sessionStorage.getItem(
      CONFIG.ADMIN_SESSION_KEY
    );


  if (!token) {

    window.location.href =
      "admin-login.html";

    return;

  }


  const adminRaw =
    sessionStorage.getItem(
      CONFIG.ADMIN_KEY
    );


  if (adminRaw) {

    try {

      const admin =
        JSON.parse(
          adminRaw
        );


      document
        .getElementById(
          "adminName"
        )
        .textContent =
        "เข้าสู่ระบบโดย: " +
        (
          admin.username ||
          "Admin"
        );

    } catch (error) {

      console.error(error);

    }

  }


  document
    .getElementById(
      "searchButton"
    )
    .addEventListener(
      "click",
      loadStudents
    );


  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      function (event) {

        if (
          event.key ===
          "Enter"
        ) {

          loadStudents();

        }

      }
    );


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      adminLogout
    );


  document
    .getElementById(
      "cancelResetButton"
    )
    .addEventListener(
      "click",
      closeResetModal
    );


  document
    .getElementById(
      "confirmResetButton"
    )
    .addEventListener(
      "click",
      resetStudentPassword
    );


  loadStudents();

}


/* ==============================================
   API REQUEST
   ============================================== */

async function apiRequest(
  payload
) {

  const response =
    await fetch(

      CONFIG.API_URL,

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(
            payload
          )

      }

    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* ==============================================
   LOAD STUDENTS
   ============================================== */

async function loadStudents() {

  const token =
    sessionStorage.getItem(
      CONFIG.ADMIN_SESSION_KEY
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  showPageMessage(
    "กำลังโหลดข้อมูล...",
    "info"
  );


  try {

    const result =
      await apiRequest({

        action:
          "adminGetStudents",

        token:
          token,

        search:
          search

      });


    if (
      result.code ===
      "ADMIN_SESSION_EXPIRED"
    ) {

      handleSessionExpired();

      return;

    }


    if (!result.success) {

      showPageMessage(

        result.message ||
        "ไม่สามารถโหลดข้อมูลได้",

        "error"

      );

      return;

    }


    students =
      result.students ||
      [];


    renderStudents(
      students
    );


    showPageMessage(

      "พบข้อมูล " +
      students.length +
      " รายการ",

      "success"

    );


  } catch (error) {

    console.error(
      error
    );


    showPageMessage(

      "ไม่สามารถเชื่อมต่อระบบได้",

      "error"

    );

  }

}


/* ==============================================
   RENDER STUDENTS
   ============================================== */

function renderStudents(
  list
) {

  const tbody =
    document.getElementById(
      "studentTableBody"
    );


  tbody.innerHTML =
    "";


  if (
    !list ||
    list.length === 0
  ) {

    tbody.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >

          ไม่พบข้อมูลนักศึกษา

        </td>

      </tr>

    `;

    return;

  }


  list.forEach(
    function (student) {

      const tr =
        document.createElement(
          "tr"
        );


      const fullName =

        (
          student.prefix_th ||
          ""
        ) +

        (
          student.firstname_th ||
          ""
        ) +

        " " +

        (
          student.lastname_th ||
          ""
        );


      tr.innerHTML = `

        <td>
          ${escapeHtml(
            student.student_id || "-"
          )}
        </td>

        <td>
          ${escapeHtml(
            fullName.trim() || "-"
          )}
        </td>

        <td>
          ${escapeHtml(
            student.department || "-"
          )}
        </td>

        <td>
          ${escapeHtml(
            student.status || "-"
          )}
        </td>

        <td>
          ${escapeHtml(
            student.phone || "-"
          )}
        </td>

        <td>

          <button
            class="action-button edit-button"
            type="button"
            data-action="edit"
            data-id="${escapeAttribute(
              student.student_id
            )}"
          >

            แก้ไข

          </button>


          <button
            class="action-button reset-button"
            type="button"
            data-action="reset"
            data-id="${escapeAttribute(
              student.student_id
            )}"
          >

            รีเซ็ตรหัสผ่าน

          </button>

        </td>

      `;


      tbody.appendChild(
        tr
      );

    }
  );


  tbody
    .querySelectorAll(
      "button[data-action='reset']"
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            openResetModal(
              button.dataset.id
            );

          }
        );

      }
    );


  tbody
    .querySelectorAll(
      "button[data-action='edit']"
    )
    .forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            editStudent(
              button.dataset.id
            );

          }
        );

      }
    );

}


/* ==============================================
   OPEN RESET MODAL
   ============================================== */

function openResetModal(
  studentId
) {

  selectedStudent =
    students.find(
      function (student) {

        return String(
          student.student_id
        ) ===
        String(studentId);

      }
    );


  if (!selectedStudent) {

    showPageMessage(
      "ไม่พบข้อมูลนักศึกษา",
      "error"
    );

    return;

  }


  const fullName =

    (
      selectedStudent.prefix_th ||
      ""
    ) +

    (
      selectedStudent.firstname_th ||
      ""
    ) +

    " " +

    (
      selectedStudent.lastname_th ||
      ""
    );


  document
    .getElementById(
      "resetStudentInfo"
    )
    .innerHTML = `

      <strong>
        รหัสนักศึกษา:
      </strong>

      ${escapeHtml(
        selectedStudent.student_id
      )}

      <br>

      <strong>
        ชื่อ:
      </strong>

      ${escapeHtml(
        fullName.trim()
      )}

    `;


  document
    .getElementById(
      "newPassword"
    )
    .value =
    "";


  document
    .getElementById(
      "confirmPassword"
    )
    .value =
    "";


  showResetMessage(
    "",
    ""
  );


  document
    .getElementById(
      "resetModal"
    )
    .classList.add(
      "show"
    );


  setTimeout(
    function () {

      document
        .getElementById(
          "newPassword"
        )
        .focus();

    },
    100
  );

}


/* ==============================================
   CLOSE RESET MODAL
   ============================================== */

function closeResetModal() {

  selectedStudent =
    null;


  document
    .getElementById(
      "resetModal"
    )
    .classList.remove(
      "show"
    );

}


/* ==============================================
   RESET PASSWORD
   ============================================== */

async function resetStudentPassword() {

  if (!selectedStudent) {

    showResetMessage(
      "ไม่พบข้อมูลนักศึกษา",
      "error"
    );

    return;

  }


  const newPassword =
    document
      .getElementById(
        "newPassword"
      )
      .value;


  const confirmPassword =
    document
      .getElementById(
        "confirmPassword"
      )
      .value;


  /* =========================================
     VALIDATE
     ========================================= */

  if (!newPassword) {

    showResetMessage(

      "กรุณากรอกรหัสผ่านใหม่",

      "error"

    );

    return;

  }


  if (
    newPassword.length < 6
  ) {

    showResetMessage(

      "รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร",

      "error"

    );

    return;

  }


  if (
    newPassword !==
    confirmPassword
  ) {

    showResetMessage(

      "รหัสผ่านทั้งสองช่องไม่ตรงกัน",

      "error"

    );

    return;

  }


  const token =
    sessionStorage.getItem(
      CONFIG.ADMIN_SESSION_KEY
    );


  const button =
    document.getElementById(
      "confirmResetButton"
    );


  button.disabled =
    true;


  button.textContent =
    "กำลังบันทึก...";


  showResetMessage(

    "กำลังรีเซ็ตรหัสผ่าน...",

    "info"

  );


  try {

    const result =
      await apiRequest({

        action:
          "adminResetPassword",

        token:
          token,

        student_id:
          selectedStudent.student_id,

        newPassword:
          newPassword

      });


    if (
      result.code ===
      "ADMIN_SESSION_EXPIRED"
    ) {

      closeResetModal();

      handleSessionExpired();

      return;

    }


    if (!result.success) {

      showResetMessage(

        result.message ||
        "ไม่สามารถรีเซ็ตรหัสผ่านได้",

        "error"

      );

      return;

    }


    showResetMessage(

      "รีเซ็ตรหัสผ่านสำเร็จ",

      "success"

    );


    showPageMessage(

      "รีเซ็ตรหัสผ่านของ " +
      selectedStudent.student_id +
      " สำเร็จ",

      "success"

    );


    setTimeout(
      function () {

        closeResetModal();

      },
      900
    );


  } catch (error) {

    console.error(
      error
    );


    showResetMessage(

      "ไม่สามารถเชื่อมต่อระบบได้",

      "error"

    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "รีเซ็ตรหัสผ่าน";

  }

}


/* ==============================================
   EDIT STUDENT
   ============================================== */

function editStudent(
  studentId
) {

  const student =
    students.find(
      function (item) {

        return String(
          item.student_id
        ) ===
        String(studentId);

      }
    );


  if (!student) {

    showPageMessage(
      "ไม่พบข้อมูลนักศึกษา",
      "error"
    );

    return;

  }


  /*
   * จุดนี้เตรียมไว้สำหรับ
   * Modal แก้ไขข้อมูลเต็มรูปแบบ
   */

  showPageMessage(

    "เลือกนักศึกษา " +
    student.student_id +
    " สำหรับแก้ไขข้อมูล",

    "info"

  );

}


/* ==============================================
   ADMIN LOGOUT
   ============================================== */

async function adminLogout() {

  const token =
    sessionStorage.getItem(
      CONFIG.ADMIN_SESSION_KEY
    );


  try {

    if (token) {

      await apiRequest({

        action:
          "adminLogout",

        token:
          token

      });

    }

  } catch (error) {

    console.error(
      error
    );

  }


  sessionStorage.removeItem(
    CONFIG.ADMIN_SESSION_KEY
  );


  sessionStorage.removeItem(
    CONFIG.ADMIN_KEY
  );


  window.location.href =
    "admin-login.html";

}


/* ==============================================
   SESSION EXPIRED
   ============================================== */

function handleSessionExpired() {

  sessionStorage.removeItem(
    CONFIG.ADMIN_SESSION_KEY
  );


  sessionStorage.removeItem(
    CONFIG.ADMIN_KEY
  );


  window.location.href =
    "admin-login.html";

}


/* ==============================================
   PAGE MESSAGE
   ============================================== */

function showPageMessage(
  text,
  type
) {

  const element =
    document.getElementById(
      "pageMessage"
    );


  element.textContent =
    text;


  element.className =
    "message";


  if (type) {

    element.classList.add(
      type
    );

  }

}


/* ==============================================
   RESET MESSAGE
   ============================================== */

function showResetMessage(
  text,
  type
) {

  const element =
    document.getElementById(
      "resetMessage"
    );


  element.textContent =
    text;


  element.className =
    "message";


  if (type) {

    element.classList.add(
      type
    );

  }

}


/* ==============================================
   ESCAPE HTML
   ============================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==============================================
   ESCAPE ATTRIBUTE
   ============================================== */

function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}
