<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0a1383"
    >

    <title>
        Admin Dashboard | Student Card System
    </title>


    <style>

        /* =========================================
           RESET
           ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                Arial,
                "Noto Sans Thai",
                sans-serif;

            background:
                #f5f6fb;

            color:
                #111827;

        }


        /* =========================================
           COLOR
           ========================================= */

        :root {

            --blue:
                #0a1383;

            --blue-dark:
                #080f6d;

            --blue-light:
                #eef0ff;

            --white:
                #ffffff;

            --gray:
                #6b7280;

            --border:
                #e5e7eb;

            --danger:
                #dc2626;

            --success:
                #15803d;

        }


        /* =========================================
           HEADER
           ========================================= */

        .admin-header {

            position:
                sticky;

            top:
                0;

            z-index:
                1000;

            width:
                100%;

            background:
                var(--white);

            border-bottom:
                1px solid var(--border);

            box-shadow:
                0 3px 15px
                rgba(10, 19, 131, 0.06);

        }


        .header-inner {

            width:
                100%;

            max-width:
                1200px;

            margin:
                0 auto;

            min-height:
                72px;

            padding:
                12px 20px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;

        }


        /* =========================================
           BRAND
           ========================================= */

        .brand {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            min-width:
                0;

        }


        .brand-icon {

            width:
                45px;

            height:
                45px;

            flex:
                0 0 45px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                12px;

            background:
                var(--blue-light);

            color:
                var(--blue);

            font-size:
                23px;

        }


        .brand-text {

            min-width:
                0;

        }


        .brand-title {

            margin:
                0;

            color:
                var(--blue);

            font-size:
                18px;

            font-weight:
                700;

        }


        .brand-subtitle {

            margin:
                2px 0 0;

            color:
                var(--gray);

            font-size:
                10px;

            letter-spacing:
                0.7px;

        }


        /* =========================================
           ADMIN INFO
           ========================================= */

        .admin-info {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        .admin-name {

            color:
                #374151;

            font-size:
                13px;

            font-weight:
                600;

        }


        .logout-button {

            height:
                38px;

            padding:
                0 14px;

            border:
                none;

            border-radius:
                8px;

            background:
                #f3f4f6;

            color:
                #374151;

            font-size:
                12px;

            font-weight:
                600;

            cursor:
                pointer;

        }


        .logout-button:hover {

            background:
                #e5e7eb;

        }



        /* =========================================
           PAGE
           ========================================= */

        .admin-page {

            width:
                100%;

            max-width:
                1200px;

            margin:
                0 auto;

            padding:
                25px 20px 40px;

        }


        /* =========================================
           PAGE TITLE
           ========================================= */

        .page-heading {

            margin-bottom:
                22px;

        }


        .page-heading h1 {

            margin:
                0;

            color:
                var(--blue);

            font-size:
                25px;

        }


        .page-heading p {

            margin:
                6px 0 0;

            color:
                var(--gray);

            font-size:
                13px;

        }


        /* =========================================
           STAT CARDS
           ========================================= */

        .stats {

            display:
                grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap:
                15px;

            margin-bottom:
                20px;

        }


        .stat-card {

            background:
                var(--white);

            border:
                1px solid var(--border);

            border-radius:
                13px;

            padding:
                18px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.04);

        }


        .stat-label {

            color:
                var(--gray);

            font-size:
                12px;

        }


        .stat-value {

            margin-top:
                5px;

            color:
                var(--blue);

            font-size:
                27px;

            font-weight:
                700;

        }



        /* =========================================
           CONTENT CARD
           ========================================= */

        .content-card {

            background:
                var(--white);

            border:
                1px solid var(--border);

            border-radius:
                15px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.04);

            overflow:
                hidden;

        }


        /* =========================================
           TOOLBAR
           ========================================= */

        .toolbar {

            padding:
                18px;

            border-bottom:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                12px;

            flex-wrap:
                wrap;

        }


        .search-box {

            flex:
                1;

            min-width:
                240px;

            position:
                relative;

        }


        .search-box input {

            width:
                100%;

            height:
                45px;

            padding:
                0 15px;

            border:
                1px solid #d9ddea;

            border-radius:
                9px;

            outline:
                none;

            font-size:
                14px;

            color:
                #111827;

            background:
                #ffffff;

        }


        .search-box input:focus {

            border-color:
                var(--blue);

            box-shadow:
                0 0 0 3px
                rgba(
                    10,
                    19,
                    131,
                    0.08
                );

        }


        .toolbar-buttons {

            display:
                flex;

            gap:
                8px;

        }


        .toolbar-button {

            height:
                45px;

            padding:
                0 16px;

            border:
                none;

            border-radius:
                9px;

            background:
                var(--blue);

            color:
                #ffffff;

            font-size:
                13px;

            font-weight:
                600;

            cursor:
                pointer;

        }


        .toolbar-button:hover {

            background:
                var(--blue-dark);

        }


        .toolbar-button.secondary {

            background:
                #f3f4f6;

            color:
                #374151;

        }


        .toolbar-button.secondary:hover {

            background:
                #e5e7eb;

        }



        /* =========================================
           MESSAGE
           ========================================= */

        .system-message {

            display:
                none;

            margin:
                15px 18px 0;

            padding:
                11px 14px;

            border-radius:
                8px;

            font-size:
                13px;

            font-weight:
                600;

        }


        .system-message.show {

            display:
                block;

        }


        .system-message.error {

            background:
                #fef2f2;

            color:
                var(--danger);

        }


        .system-message.success {

            background:
                #f0fdf4;

            color:
                var(--success);

        }


        .system-message.info {

            background:
                var(--blue-light);

            color:
                var(--blue);

        }



        /* =========================================
           TABLE
           ========================================= */

        .table-container {

            width:
                100%;

            overflow-x:
                auto;

        }


        table {

            width:
                100%;

            min-width:
                850px;

            border-collapse:
                collapse;

        }


        thead {

            background:
                #f8f9fd;

        }


        th {

            padding:
                14px 15px;

            text-align:
                left;

            color:
                #374151;

            font-size:
                12px;

            font-weight:
                700;

            white-space:
                nowrap;

            border-bottom:
                1px solid var(--border);

        }


        td {

            padding:
                14px 15px;

            border-bottom:
                1px solid #f0f1f5;

            font-size:
                13px;

            color:
                #374151;

            vertical-align:
                middle;

        }


        tbody tr:hover {

            background:
                #fafbff;

        }


        .student-id {

            color:
                var(--blue);

            font-weight:
                700;

            white-space:
                nowrap;

        }


        .student-name {

            color:
                #111827;

            font-weight:
                600;

        }


        .department {

            color:
                #4b5563;

        }


        /* =========================================
           STATUS
           ========================================= */

        .status-badge {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                27px;

            padding:
                4px 10px;

            border-radius:
                999px;

            background:
                #eef0ff;

            color:
                var(--blue);

            font-size:
                11px;

            font-weight:
                600;

            white-space:
                nowrap;

        }


        .status-badge.active {

            background:
                #ecfdf3;

            color:
                #15803d;

        }


        .status-badge.inactive {

            background:
                #fef2f2;

            color:
                #dc2626;

        }



        /* =========================================
           EMPTY
           ========================================= */

        .empty-state {

            padding:
                60px 20px;

            text-align:
                center;

            color:
                var(--gray);

        }


        .empty-icon {

            font-size:
                42px;

            margin-bottom:
                10px;

            opacity:
                0.7;

        }


        .empty-title {

            color:
                #374151;

            font-size:
                15px;

            font-weight:
                600;

        }


        .empty-text {

            margin-top:
                5px;

            font-size:
                12px;

        }



        /* =========================================
           LOADING
           ========================================= */

        .loading {

            padding:
                60px 20px;

            text-align:
                center;

            color:
                var(--blue);

            font-size:
                14px;

            font-weight:
                600;

        }


        .spinner {

            width:
                34px;

            height:
                34px;

            margin:
                0 auto 12px;

            border:
                4px solid #e5e7eb;

            border-top-color:
                var(--blue);

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }



        /* =========================================
           FOOTER
           ========================================= */

        .admin-footer {

            margin-top:
                25px;

            text-align:
                center;

            color:
                #9ca3af;

            font-size:
                10px;

        }



        /* =========================================
           MOBILE
           ========================================= */

        @media (
            max-width: 768px
        ) {


            .header-inner {

                padding:
                    10px 14px;

            }


            .brand-title {

                font-size:
                    15px;

            }


            .brand-subtitle {

                font-size:
                    8px;

            }


            .admin-name {

                display:
                    none;

            }


            .admin-page {

                padding:
                    18px 12px 30px;

            }


            .page-heading h1 {

                font-size:
                    21px;

            }


            .stats {

                grid-template-columns:
                    1fr;

                gap:
                    10px;

            }


            .stat-card {

                padding:
                    14px;

            }


            .stat-value {

                font-size:
                    23px;

            }


            .toolbar {

                align-items:
                    stretch;

            }


            .search-box {

                min-width:
                    100%;

            }


            .toolbar-buttons {

                width:
                    100%;

            }


            .toolbar-button {

                flex:
                    1;

            }

        }


        @media (
            max-width: 480px
        ) {


            .brand-icon {

                width:
                    40px;

                height:
                    40px;

                flex-basis:
                    40px;

                font-size:
                    20px;

            }


            .logout-button {

                padding:
                    0 11px;

            }


            .page-heading {

                margin-bottom:
                    15px;

            }


            .content-card {

                border-radius:
                    11px;

            }

        }

    </style>

</head>


<body>


<!-- =============================================
     HEADER
     ============================================= -->

<header class="admin-header">

                🛡️

            <div class="brand-text">

    <div class="stats">


        <div class="stat-card">

            </div>

            </div>


            <div

            >

<!-- =============================================
     JAVASCRIPT
     ============================================= -->

<script>


/* ==============================================
   CONFIG
   ============================================== */

const CONFIG = {

    API_URL:
        "https://script.google.com/macros/s/AKfycbxCvk2wb6FydCKNkEDvApbTgZWmSFoAzPvvM2sSDOIwSgvftMoQxIX3cy7npP3_6xT4/exec",

    ADMIN_SESSION_KEY:
        "admin_session",

    ADMIN_KEY:
        "admin_data"

};



/* ==============================================
   GLOBAL DATA
   ============================================== */

let students =
    [];



/* ==============================================
   PAGE READY
   ============================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
         * ตรวจสอบ Admin Session
         */

        checkAdminSession();


        /*
         * แสดงชื่อ Admin
         */

        loadAdminInfo();


        /*
         * Event
         */

        document
            .getElementById(
                "searchButton"
            )
            .addEventListener(
                "click",
                loadStudents
            );


        document
            .getElementById(
                "refreshButton"
            )
            .addEventListener(
                "click",
                function () {

                    document
                        .getElementById(
                            "searchInput"
                        )
                        .value = "";

                    loadStudents();

                }
            );


        document
            .getElementById(
                "searchInput"
            )
            .addEventListener(
                "keydown",
                function (event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        loadStudents();

                    }

                }
            );


        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                adminLogout
            );


        /*
         * โหลดข้อมูลทันที
         */

        loadStudents();

    }
);



/* ==============================================
   CHECK ADMIN SESSION
   ============================================== */

function checkAdminSession() {


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    if (!token) {

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}



/* ==============================================
   LOAD ADMIN INFO
   ============================================== */

function loadAdminInfo() {


    const raw =
        sessionStorage.getItem(
            CONFIG.ADMIN_KEY
        );


    if (!raw) {

        return;

    }


    try {


        const admin =
            JSON.parse(
                raw
            );


        const name =
            admin.username ||
            "Admin";


        document
            .getElementById(
                "adminName"
            )
            .textContent =
            name;


    } catch (error) {

        console.error(
            error
        );

    }

}



/* ==============================================
   LOAD STUDENTS
   ============================================== */

async function loadStudents() {


    if (
        !checkAdminSession()
    ) {

        return;

    }


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();


    /*
     * Loading
     */

    showLoading();


    hideMessage();


    try {


        const response =
            await fetch(

                CONFIG.API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "adminGetStudents",

                            token:
                                token,

                            search:
                                search

                        })

                }

            );


        /*
         * HTTP Error
         */

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        /*
         * JSON
         */

        const result =
            await response.json();


        console.log(
            "ADMIN STUDENTS RESULT:",
            result
        );


        /*
         * Session หมดอายุ
         */

        if (
            result.code ===
            "ADMIN_SESSION_EXPIRED"
        ) {


            sessionStorage.removeItem(
                CONFIG.ADMIN_SESSION_KEY
            );


            sessionStorage.removeItem(
                CONFIG.ADMIN_KEY
            );


            showMessage(
                "Session หมดอายุ กำลังกลับหน้า Admin Login...",
                "error"
            );


            setTimeout(
                function () {

                    window.location.href =
                        "admin-login.html";

                },
                1000
            );


            return;

        }


        /*
         * Error
         */

        if (
            !result.success
        ) {

            showMessage(

                result.message ||
                "ไม่สามารถโหลดข้อมูลได้",

                "error"

            );


            renderEmpty(
                "ไม่สามารถโหลดข้อมูลได้"
            );


            return;

        }


        /*
         * เก็บข้อมูล
         */

        students =
            Array.isArray(
                result.students
            )
                ? result.students
                : [];


        /*
         * Render
         */

        renderStudents(
            students
        );


        /*
         * Statistics
         */

        updateStatistics(
            students
        );


    }


    catch (error) {


        console.error(
            "LOAD STUDENTS ERROR:",
            error
        );


        showMessage(

            "ไม่สามารถเชื่อมต่อระบบได้",

            "error"

        );


        renderEmpty(
            "ไม่สามารถเชื่อมต่อฐานข้อมูลได้"
        );

    }

}



/* ==============================================
   RENDER STUDENTS
   ============================================== */

function renderStudents(
    list
) {


    const tableArea =
        document.getElementById(
            "tableArea"
        );


    /*
     * ไม่มีข้อมูล
     */

    if (
        !list ||
        list.length === 0
    ) {

        renderEmpty(
            "ไม่พบข้อมูลนักศึกษา"
        );

        return;

    }


    /*
     * สร้าง Table
     */

    let html = "";


    html +=
        '<table>';


    html +=
        '<thead>';


    html +=
        '<tr>';


    html +=
        '<th>รหัสนักศึกษา</th>';


    html +=
        '<th>ชื่อ-สกุล</th>';


    html +=
        '<th>สาขาวิชา</th>';


    html +=
        '<th>สถานะ</th>';


    html +=
        '<th>เบอร์โทรศัพท์</th>';


    html +=
        '<th>วันออกบัตร</th>';


    html +=
        '<th>วันหมดอายุ</th>';


    html +=
        '</tr>';


    html +=
        '</thead>';


    html +=
        '<tbody>';



    list.forEach(
        function(student) {


            const fullName =
                buildThaiName(
                    student
                );


            const status =
                student.status ||
                "-";


            const statusClass =
                getStatusClass(
                    status
                );


            html +=
                '<tr>';


            /*
             * ID
             */

            html +=
                '<td>' +

                '<span class="student-id">' +

                escapeHtml(
                    student.student_id ||
                    "-"
                ) +

                '</span>' +

                '</td>';


            /*
             * NAME
             */

            html +=
                '<td>' +

                '<span class="student-name">' +

                escapeHtml(
                    fullName
                ) +

                '</span>' +

                '</td>';


            /*
             * DEPARTMENT
             */

            html +=
                '<td>' +

                '<span class="department">' +

                escapeHtml(
                    student.department ||
                    "-"
                ) +

                '</span>' +

                '</td>';


            /*
             * STATUS
             */

            html +=
                '<td>' +

                '<span class="status-badge ' +
                statusClass +
                '">' +

                escapeHtml(
                    status
                ) +

                '</span>' +

                '</td>';


            /*
             * PHONE
             */

            html +=
                '<td>' +

                escapeHtml(
                    student.phone ||
                    "-"
                ) +

                '</td>';


            /*
             * ISSUE DATE
             */

            html +=
                '<td>' +

                escapeHtml(
                    student.issue_date ||
                    "-"
                ) +

                '</td>';


            /*
             * EXPIRE DATE
             */

            html +=
                '<td>' +

                escapeHtml(
                    student.expire_date ||
                    "-"
                ) +

                '</td>';


            html +=
                '</tr>';

        }
    );


    html +=
        '</tbody>';


    html +=
        '</table>';


    tableArea.innerHTML =
        html;

}



/* ==============================================
   BUILD THAI NAME
   ============================================== */

function buildThaiName(
    student
) {


    const prefix =
        student.prefix_th ||
        "";


    const firstname =
        student.firstname_th ||
        "";


    const lastname =
        student.lastname_th ||
        "";


    return (

        prefix +
        firstname +
        " " +
        lastname

    ).trim();

}



/* ==============================================
   STATUS CLASS
   ============================================== */

function getStatusClass(
    status
) {


    const value =
        String(
            status || ""
        )
        .toLowerCase();


    if (

        value.includes(
            "ปกติ"
        ) ||

        value.includes(
            "active"
        )

    ) {

        return "active";

    }


    if (

        value.includes(
            "พ้น"
        ) ||

        value.includes(
            "inactive"
        ) ||

        value.includes(
            "ลาออก"
        )

    ) {

        return "inactive";

    }


    return "";

}



/* ==============================================
   UPDATE STATISTICS
   ============================================== */

function updateStatistics(
    list
) {


    const total =
        list.length;


    let active =
        0;


    list.forEach(
        function(student) {


            const status =
                String(
                    student.status || ""
                );


            if (

                status.includes(
                    "ปกติ"
                ) ||

                status.toLowerCase()
                    .includes(
                        "active"
                    )

            ) {

                active++;

            }

        }
    );


    document
        .getElementById(
            "totalStudents"
        )
        .textContent =
        total;


    document
        .getElementById(
            "activeStudents"
        )
        .textContent =
        active;


    document
        .getElementById(
            "displayStudents"
        )
        .textContent =
        total;

}

   LOADING

function showLoading() {

        )

                <div class="spinner"></div>

/* ==============================================

   ============================================== */

function renderEmpty(

            "tableArea"
        )

            <div class="empty-state">

                <div class="empty-icon">

/* ==============================================
   SHOW MESSAGE
   ============================================== */

function showMessage(
    text,
    type
) {


    const element =
        document.getElementById(
            "systemMessage"
        );


    if (!element) {

        return;

    }


    element.textContent =
        text;


    element.className =
        "system-message show";


    if (type) {

        element.classList.add(
            type
        );

    }

}



/* ==============================================
   HIDE MESSAGE
   ============================================== */

function hideMessage() {


    const element =
        document.getElementById(
            "systemMessage"
        );


    if (!element) {

        return;

    }


    element.textContent =
        "";


    element.className =
        "system-message";

}



/* ==============================================
   ESCAPE HTML
   ============================================== */

function escapeHtml(
    value
) {


    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==============================================
   ADMIN LOGOUT
   ============================================== */

async function adminLogout() {


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    /*
     * ถ้ามี Token
     * แจ้ง Backend ให้ลบ Session
     */

    if (token) {


        try {


            await fetch(

                CONFIG.API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "adminLogout",

                            token:
                                token

                        })

                }

            );


        } catch (error) {


            console.error(
                "ADMIN LOGOUT ERROR:",
                error
            );

        }

    }


    /*
     * ลบข้อมูลใน Browser
     */

    sessionStorage.removeItem(
        CONFIG.ADMIN_SESSION_KEY
    );


    sessionStorage.removeItem(
        CONFIG.ADMIN_KEY
    );


    /*
     * กลับหน้า Login
     */

    window.location.href =
        "admin-login.html";

}
