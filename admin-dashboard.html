<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0a1383"
>

<title>
    Admin Dashboard | Student Card System
</title>


<style>

* {
    box-sizing: border-box;
}


:root {

    --blue:
        #0a1383;

    --blue-dark:
        #080f6d;

    --blue-light:
        #eef0ff;

    --white:
        #ffffff;

    --gray:
        #6b7280;

    --border:
        #e5e7eb;

    --danger:
        #dc2626;

    --success:
        #15803d;

}


body {

    margin: 0;

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background:
        #f5f6fb;

    color:
        #111827;

}


/* =========================================
   HEADER
   ========================================= */

.admin-header {

    position:
        sticky;

    top: 0;

    z-index: 1000;

    background:
        #ffffff;

    border-bottom:
        1px solid var(--border);

    box-shadow:
        0 3px 15px
        rgba(10,19,131,.06);

}


.header-inner {

    max-width:
        1200px;

    min-height:
        72px;

    margin:
        auto;

    padding:
        12px 20px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

}


.brand {

    display:
        flex;

    align-items:
        center;

    gap:
        12px;

}


.brand-icon {

    width:
        45px;

    height:
        45px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        12px;

    background:
        var(--blue-light);

    color:
        var(--blue);

    font-size:
        23px;

}


.brand-title {

    color:
        var(--blue);

    font-size:
        18px;

    font-weight:
        700;

}


.brand-subtitle {

    color:
        var(--gray);

    font-size:
        10px;

    letter-spacing:
        .7px;

}


.admin-info {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

}


.admin-name {

    font-size:
        13px;

    font-weight:
        600;

}


.logout-button {

    height:
        38px;

    padding:
        0 14px;

    border:
        none;

    border-radius:
        8px;

    background:
        #f3f4f6;

    color:
        #374151;

    cursor:
        pointer;

}


/* =========================================
   PAGE
   ========================================= */

.admin-page {

    max-width:
        1200px;

    margin:
        auto;

    padding:
        25px 20px 40px;

}


.page-heading {

    margin-bottom:
        22px;

}


.page-heading h1 {

    margin: 0;

    color:
        var(--blue);

    font-size:
        25px;

}


.page-heading p {

    margin:
        6px 0 0;

    color:
        var(--gray);

    font-size:
        13px;

}


/* =========================================
   STATS
   ========================================= */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:
        15px;

    margin-bottom:
        20px;

}


.stat-card {

    padding:
        18px;

    background:
        #ffffff;

    border:
        1px solid var(--border);

    border-radius:
        13px;

}


.stat-label {

    color:
        var(--gray);

    font-size:
        12px;

}


.stat-value {

    margin-top:
        5px;

    color:
        var(--blue);

    font-size:
        27px;

    font-weight:
        700;

}


/* =========================================
   CONTENT
   ========================================= */

.content-card {

    background:
        #ffffff;

    border:
        1px solid var(--border);

    border-radius:
        15px;

    overflow:
        hidden;

}


.toolbar {

    padding:
        18px;

    border-bottom:
        1px solid var(--border);

    display:
        flex;

    gap:
        12px;

}


.search-box {

    flex:
        1;

}


.search-box input {

    width:
        100%;

    height:
        45px;

    padding:
        0 14px;

    border:
        1px solid #d9ddea;

    border-radius:
        9px;

    outline:
        none;

    font-size:
        14px;

}


.search-box input:focus {

    border-color:
        var(--blue);

}


.toolbar-button {

    height:
        45px;

    padding:
        0 16px;

    border:
        none;

    border-radius:
        9px;

    background:
        var(--blue);

    color:
        #ffffff;

    font-weight:
        600;

    cursor:
        pointer;

}


.toolbar-button.secondary {

    background:
        #f3f4f6;

    color:
        #374151;

}


/* =========================================
   MESSAGE
   ========================================= */

.system-message {

    display:
        none;

    margin:
        15px 18px 0;

    padding:
        11px 14px;

    border-radius:
        8px;

    font-size:
        13px;

}


.system-message.show {

    display:
        block;

}


.system-message.error {

    background:
        #fef2f2;

    color:
        var(--danger);

}


.system-message.success {

    background:
        #f0fdf4;

    color:
        var(--success);

}


.system-message.info {

    background:
        var(--blue-light);

    color:
        var(--blue);

}


/* =========================================
   TABLE
   ========================================= */

.table-container {

    width:
        100%;

    overflow-x:
        auto;

}


table {

    width:
        100%;

    min-width:
        950px;

    border-collapse:
        collapse;

}


thead {

    background:
        #f8f9fd;

}


th {

    padding:
        14px;

    text-align:
        left;

    font-size:
        12px;

    color:
        #374151;

    white-space:
        nowrap;

    border-bottom:
        1px solid var(--border);

}


td {

    padding:
        14px;

    font-size:
        13px;

    border-bottom:
        1px solid #f0f1f5;

}


.student-id {

    color:
        var(--blue);

    font-weight:
        700;

}


.student-name {

    font-weight:
        600;

}


.status-badge {

    display:
        inline-flex;

    padding:
        4px 10px;

    border-radius:
        999px;

    background:
        var(--blue-light);

    color:
        var(--blue);

    font-size:
        11px;

    white-space:
        nowrap;

}


.status-badge.active {

    background:
        #ecfdf3;

    color:
        #15803d;

}


.status-badge.inactive {

    background:
        #fef2f2;

    color:
        #dc2626;

}


/* =========================================
   EDIT BUTTON
   ========================================= */

.edit-button {

    height:
        34px;

    padding:
        0 12px;

    border:
        none;

    border-radius:
        7px;

    background:
        var(--blue-light);

    color:
        var(--blue);

    font-size:
        12px;

    font-weight:
        600;

    cursor:
        pointer;

}


.edit-button:hover {

    background:
        #dfe3ff;

}


/* =========================================
   LOADING
   ========================================= */

.loading {

    padding:
        60px 20px;

    text-align:
        center;

    color:
        var(--blue);

}


.spinner {

    width:
        34px;

    height:
        34px;

    margin:
        0 auto 12px;

    border:
        4px solid #e5e7eb;

    border-top-color:
        var(--blue);

    border-radius:
        50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =========================================
   EMPTY
   ========================================= */

.empty-state {

    padding:
        60px 20px;

    text-align:
        center;

    color:
        var(--gray);

}


/* =========================================
   MODAL
   ========================================= */

.modal-overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        2000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        15px;

    background:
        rgba(
            0,
            0,
            0,
            .45
        );

}


.modal-overlay.show {

    display:
        flex;

}


.modal {

    width:
        100%;

    max-width:
        650px;

    max-height:
        90vh;

    overflow-y:
        auto;

    background:
        #ffffff;

    border-radius:
        16px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.2);

}


.modal-header {

    padding:
        20px;

    border-bottom:
        1px solid var(--border);

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

}


.modal-title {

    margin:
        0;

    color:
        var(--blue);

    font-size:
        19px;

}


.modal-close {

    width:
        36px;

    height:
        36px;

    border:
        none;

    border-radius:
        8px;

    background:
        #f3f4f6;

    color:
        #374151;

    font-size:
        20px;

    cursor:
        pointer;

}


.modal-body {

    padding:
        20px;

}


.form-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:
        15px;

}


.form-group {

    display:
        flex;

    flex-direction:
        column;

}


.form-group.full {

    grid-column:
        1 / -1;

}


.form-group label {

    margin-bottom:
        6px;

    font-size:
        12px;

    font-weight:
        600;

    color:
        #374151;

}


.form-group input,
.form-group select {

    width:
        100%;

    height:
        43px;

    padding:
        0 11px;

    border:
        1px solid #d9ddea;

    border-radius:
        8px;

    outline:
        none;

    font-size:
        13px;

}


.form-group input:focus,
.form-group select:focus {

    border-color:
        var(--blue);

}


.readonly-input {

    background:
        #f3f4f6;

    color:
        #6b7280;

}


.modal-footer {

    padding:
        15px 20px 20px;

    display:
        flex;

    justify-content:
        flex-end;

    gap:
        10px;

}


.modal-button {

    height:
        43px;

    padding:
        0 18px;

    border:
        none;

    border-radius:
        8px;

    cursor:
        pointer;

    font-size:
        13px;

    font-weight:
        600;

}


.modal-button.cancel {

    background:
        #f3f4f6;

    color:
        #374151;

}


.modal-button.save {

    background:
        var(--blue);

    color:
        #ffffff;

}


.modal-button.save:hover {

    background:
        var(--blue-dark);

}


.modal-button:disabled {

    opacity:
        .6;

    cursor:
        not-allowed;

}


/* =========================================
   FOOTER
   ========================================= */

.admin-footer {

    margin-top:
        25px;

    text-align:
        center;

    color:
        #9ca3af;

    font-size:
        10px;

}


/* =========================================
   MOBILE
   ========================================= */

@media (
    max-width:768px
) {

    .header-inner {

        padding:
            10px 14px;

    }


    .admin-name {

        display:
            none;

    }


    .admin-page {

        padding:
            18px 12px 30px;

    }


    .stats {

        grid-template-columns:

    }

            wrap;

    }

    }


    .toolbar-button {

        flex:
            1;

    }


    .form-grid {

        grid-template-columns:
            1fr;

    }


    .form-group.full {

        grid-column:
            auto;

    }

}

</style>

</head>

<script>


/* ==============================================
   CONFIG
   ============================================== */

const CONFIG = {

    API_URL:
        "https://script.google.com/macros/s/AKfycbxCvk2wb6FydCKNkEDvApbTgZWmSFoAzPvvM2sSDOIwSgvftMoQxIX3cy7npP3_6xT4/exec",

    ADMIN_SESSION_KEY:
        "admin_session",

    ADMIN_KEY:
        "admin_data"

};



/* ==============================================
   GLOBAL
   ============================================== */

let students = [];

let editingStudentId = "";



/* ==============================================
   DOM READY
   ============================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        checkAdminSession();

        loadAdminInfo();

        bindEvents();

        loadStudents();

    }
);



/* ==============================================
   EVENTS
   ============================================== */

function bindEvents() {


    document
        .getElementById(
            "searchButton"
        )
        .addEventListener(
            "click",
            loadStudents
        );


    document
        .getElementById(
            "refreshButton"
        )
        .addEventListener(
            "click",
            function () {

                document
                    .getElementById(
                        "searchInput"
                    )
                    .value = "";

                loadStudents();

            }
        );


    document
        .getElementById(
            "searchInput"
        )
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    loadStudents();

                }

            }
        );


    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            adminLogout
        );


    document
        .getElementById(
            "closeModalButton"
        )
        .addEventListener(
            "click",
            closeEditModal
        );


    document
        .getElementById(
            "cancelEditButton"
        )
        .addEventListener(
            "click",
            closeEditModal
        );


    document
        .getElementById(
            "saveEditButton"
        )
        .addEventListener(
            "click",
            saveStudent
        );


    document
        .getElementById(
            "editModal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target.id ===
                    "editModal"
                ) {

                    closeEditModal();

                }

            }
        );

}



/* ==============================================
   SESSION
   ============================================== */

function checkAdminSession() {


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    if (!token) {

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}



/* ==============================================
   ADMIN INFO
   ============================================== */

function loadAdminInfo() {


    const raw =
        sessionStorage.getItem(
            CONFIG.ADMIN_KEY
        );


    if (!raw) {
        return;
    }


    try {

        const admin =
            JSON.parse(
                raw
            );


        document
            .getElementById(
                "adminName"
            )
            .textContent =
            admin.username ||
            "Admin";


    } catch(error) {

        console.error(error);

    }

}



/* ==============================================
   LOAD STUDENTS
   ============================================== */

async function loadStudents() {


    if (
        !checkAdminSession()
    ) {

        return;

    }


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim();


    showLoading();

    hideMessage();


    try {


        const response =
            await fetch(

                CONFIG.API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "adminGetStudents",

                            token:
                                token,

                            search:
                                search

                        })

                }

            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            result.code ===
            "ADMIN_SESSION_EXPIRED"
        ) {

            clearAdminSession();

            window.location.href =
                "admin-login.html";

            return;

        }


        if (
            !result.success
        ) {

            showMessage(
                result.message ||
                "ไม่สามารถโหลดข้อมูลได้",
                "error"
            );

            renderEmpty();

            return;

        }


        students =
            Array.isArray(
                result.students
            )
                ? result.students
                : [];


        renderStudents(
            students
        );


        updateStatistics(
            students
        );


    } catch(error) {


        console.error(
            error
        );


        showMessage(
            "ไม่สามารถเชื่อมต่อระบบได้",
            "error"
        );


        renderEmpty();

    }

}



/* ==============================================
   RENDER TABLE
   ============================================== */

function renderStudents(
    list
) {


    const tableArea =
        document.getElementById(
            "tableArea"
        );


    if (
        !list ||
        list.length === 0
    ) {

        renderEmpty();

        return;

    }


    let html = `

<table>

<thead>

<tr>

<th>
รหัสนักศึกษา
</th>

<th>
ชื่อ-สกุล
</th>

<th>
สาขาวิชา
</th>

<th>
สถานะ
</th>

<th>
เบอร์โทรศัพท์
</th>

<th>
วันออกบัตร
</th>

<th>
วันหมดอายุ
</th>

<th>
จัดการ
</th>

</tr>

</thead>

<tbody>

`;


    list.forEach(
        function(student) {


            const name =
                buildThaiName(
                    student
                );

                student.status ||

            const statusClass =
                getStatusClass(
                    status
                );


            html += `

<tr>

<td>

<span class="student-id">

${escapeHtml(
    student.student_id || "-"
)}

</span>

</td>


<td>

<span class="student-name">

${escapeHtml(
    name
)}

</span>

</td>


<td>

${escapeHtml(
    student.department || "-"
)}

</td>


<td>

<span
    class="status-badge ${statusClass}"
>

${escapeHtml(
    status
)}

</span>

${escapeHtml(

)}

</td>

${escapeHtml(
    student.issue_date || "-"
)}

<td>

${escapeHtml(

)}

    type="button"
    data-student-id="${escapeHtml(
        student.student_id || ""
    )}"
>

✏️ แก้ไข

</button>

</td>

</tr>

`;

        }
    );


    html += `

</tbody>

</table>

`;


    tableArea.innerHTML =
        html;


    /*
     * Bind Edit Buttons
     */

    document
        .querySelectorAll(
            ".edit-button"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        openEditModal(
                            button.dataset.studentId
                        );

                    }
                );

            }
        );

}



/* ==============================================
   OPEN EDIT
   ============================================== */

function openEditModal(
    studentId
) {


    const student =
        students.find(
            function(item) {

                return String(
                    item.student_id
                ) ===
                String(
                    studentId
                );

            }
        );


    if (!student) {

        showMessage(
            "ไม่พบข้อมูลนักศึกษา",
            "error"
        );

        return;

    }


    editingStudentId =
        student.student_id;


    document
        .getElementById(
            "editStudentId"
        )
        .value =
        student.student_id || "";


    document
        .getElementById(
            "editPrefix"
        )
        .value =
        student.prefix_th || "";


    document
        .getElementById(
            "editFirstname"
        )
        .value =
        student.firstname_th || "";


    document
        .getElementById(
            "editLastname"
        )
        .value =
        student.lastname_th || "";


    document
        .getElementById(
            "editDepartment"
        )
        .value =
        student.department || "";


    document
        .getElementById(
            "editStatus"
        )
        .value =
        student.status || "";


    document
        .getElementById(
            "editPhone"
        )
        .value =
        student.phone || "";


    document
        .getElementById(
            "editPhotoUrl"
        )
        .value =
        student.photo_url || "";


    document
        .getElementById(
            "editFirstnameEn"
        )
        .value =
        student.firstname_en || "";


    document
        .getElementById(
            "editLastnameEn"
        )
        .value =

    document
        .getElementById(

/* ==============================================
   CLOSE MODAL
   ============================================== */

function closeEditModal() {


    editingStudentId =
        "";


    document
        .getElementById(
            "editModal"
        )
        .classList
        .remove(
            "show"
        );

}



/* ==============================================
   SAVE STUDENT
   ============================================== */

async function saveStudent() {


    if (!editingStudentId) {

        return;

    }


    const button =
        document.getElementById(
            "saveEditButton"
        );


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    const payload = {

        action:
            "adminUpdateStudent",

        token:
            token,

        student_id:
            editingStudentId,

        prefix_th:
            document
                .getElementById(
                    "editPrefix"
                )
                .value
                .trim(),

        firstname_th:
            document
                .getElementById(
                    "editFirstname"
                )
                .value
                .trim(),

        lastname_th:
            document
                .getElementById(
                    "editLastname"
                )
                .value
                .trim(),

        firstname_en:
            document
                .getElementById(
                    "editFirstnameEn"
                )
                .value
                .trim(),

        lastname_en:
            document
                .getElementById(
                    "editLastnameEn"
                )
                .value
                .trim(),

        department:
            document
                .getElementById(
                    "editDepartment"
                )
                .value
                .trim(),

        status:
            document
                .getElementById(
                    "editStatus"
                )
                .value
                .trim(),

        phone:
            document
                .getElementById(
                    "editPhone"
                )
                .value
                .trim(),

        photo_url:
            document
                .getElementById(
                    "editPhotoUrl"
                )
                .value
                .trim(),

        issue_date:
            document
                .getElementById(
                    "editIssueDate"
                )
                .value
                .trim(),

        expire_date:
            document
                .getElementById(
                    "editExpireDate"
                )
                .value
                .trim()

    };


    /*
     * ตรวจสอบข้อมูลพื้นฐาน
     */

    if (
        !payload.firstname_th ||
        !payload.lastname_th
    ) {

        showMessage(
            "กรุณากรอกชื่อและนามสกุล",
            "error"
        );

        return;

    }


    button.disabled =
        true;


    button.textContent =
        "กำลังบันทึก...";


    try {


        const response =
            await fetch(

                CONFIG.API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            payload
                        )

                }

            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            result.code ===
            "ADMIN_SESSION_EXPIRED"
        ) {

            clearAdminSession();

            window.location.href =
                "admin-login.html";

            return;

        }


        if (
            !result.success
        ) {

            showMessage(
                result.message ||
                "บันทึกข้อมูลไม่สำเร็จ",
                "error"
            );

            return;

        }


        /*
         * สำเร็จ
         */

        closeEditModal();


        showMessage(
            "บันทึกข้อมูลนักศึกษาสำเร็จ",
            "success"
        );


        /*
         * โหลดข้อมูลใหม่
         */

        await loadStudents();


    } catch(error) {


        console.error(
            error
        );


        showMessage(
            "ไม่สามารถเชื่อมต่อระบบได้",
            "error"
        );


    } finally {


        button.disabled =
            false;


        button.textContent =
            "💾 บันทึกข้อมูล";

    }

}



/* ==============================================
   STATISTICS
   ============================================== */

function updateStatistics(
    list
) {


    const total =
        list.length;


    let active =
        0;


    list.forEach(
        function(student) {


            const status =
                String(
                    student.status || ""
                )
                .toLowerCase();


            if (

                status.includes(
                    "ปกติ"
                ) ||

                status.includes(
                    "active"
                )

            ) {

                active++;

            }

        }
    );


    document
        .getElementById(
            "totalStudents"
        )
        .textContent =
        total;


    document
        .getElementById(
            "activeStudents"
        )
        .textContent =
        active;


    document
        .getElementById(
            "displayStudents"
        )
        .textContent =
        total;

}



/* ==============================================
   NAME
   ============================================== */

function buildThaiName(
    student
) {


    return (

        (student.prefix_th || "") +

        (student.firstname_th || "") +

        " " +

        (student.lastname_th || "")

    ).trim();

}



/* ==============================================
   STATUS
   ============================================== */

function getStatusClass(
    status
) {


    const value =
        String(
            status || ""
        )
        .toLowerCase();


    if (

        value.includes(
            "ปกติ"
        ) ||

        value.includes(
            "active"
        )

    ) {

        return "active";

    }


    if (

        value.includes(
            "ลาออก"
        ) ||

        value.includes(
            "inactive"
        ) ||

        value.includes(
            "พ้น"
        )

    ) {

        return "inactive";

    }


    return "";

}

/* ==============================================
   MESSAGE
   ============================================== */

function showMessage(
    text,
    type
) {


    const element =
        document.getElementById(
            "systemMessage"
        );


    element.textContent =
        text;


    element.className =
        "system-message show " +
        (
            type ||
            ""
        );

}


function hideMessage() {


    const element =
        document.getElementById(
            "systemMessage"
        );


    element.textContent =
        "";


    element.className =
        "system-message";

}



/* ==============================================
   ESCAPE HTML
   ============================================== */

function escapeHtml(
    value
) {


    return String(
        value ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==============================================
   CLEAR SESSION
   ============================================== */

function clearAdminSession() {


    sessionStorage.removeItem(
        CONFIG.ADMIN_SESSION_KEY
    );


    sessionStorage.removeItem(
        CONFIG.ADMIN_KEY
    );

}



/* ==============================================
   LOGOUT
   ============================================== */

async function adminLogout() {


    const token =
        sessionStorage.getItem(
            CONFIG.ADMIN_SESSION_KEY
        );


    try {


        if (token) {


            await fetch(

                CONFIG.API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "adminLogout",

                            token:
                                token

                        })

                }

            );

        }


    } catch(error) {

        console.error(
            error
        );

    }


    clearAdminSession();


    window.location.href =
        "admin-login.html";

}
